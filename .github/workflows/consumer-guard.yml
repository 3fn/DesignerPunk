# Spec 118 Task 3.2 — Consumer-Guard CI Lane
# Updated: Task 4.2 adds the static-lint step (scoped ESLint on web source)
# Updated: Task 5 adds MCP/browser boot/smoke guards (build-before-guard sequencing)
#
# Standing CI home for Spec 118's guards. This is the FIRST test-running CI in this
# repo (the only prior workflow, package-name-drift.yml, does not run any test suite).
# New guards landing in Tasks 4 and 5 attach to this lane — not a separate workflow.
#
# Guards attached to this lane:
#   Task 3.1 — consumer-config subprocess guard (ESM + CJS faithful fixtures)
#   Task 4.1 — dynamic-import smoke test (preventive; runs inside npm test)
#   Task 4.2 — static-lint step (scoped ESLint on web source; polarity deferred)
#   Task 5.1a — MCP boot/smoke guard (subprocess spawn + stderr sentinel; build:mcp first)
#   Task 5.1b — browser boot/smoke guard (jsdom eval + customElements.get; build:browser first)
#
# Scope discipline: this lane runs `npm run test:consumer`, `npm run lint`, and the
# targeted Task 5 guard invocations. Wiring the full `npm test` suite into CI is a
# separate, out-of-scope concern.
#
# Build-before-guard sequencing (Task 5): the MCP and browser guards read BUILT bundles
# from dist/mcp/ and dist/browser/. These steps build those bundles before the guards
# run. The build steps are scoped (build:mcp + build:browser only) — NOT `npm run build`
# (which includes tsc + build:validate, a heavier step not needed here).
#
# Making this a required check: enable via branch protection rules in GitHub repo
# settings (Settings → Branches → main → Require status checks → add
# "Consumer Guard / consumer-guard"). This workflow only defines the check;
# branch protection is a repo-settings action Peter takes.
#
# @see Spec 118 Task 3.2 (CI lane creation)
# @see Spec 118 Task 4.2 (lint step — polarity deferred to Group 9 / Task 8)
# @see tests/consumer-integration.test.ts — the consumer guard that runs here
# @see eslint.config.js — the scoped lint config (web source only)
# @see tests/README.md — in-repo note on this lane

name: Consumer Guard

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  consumer-guard:
    name: Consumer Guard
    runs-on: ubuntu-latest
    # Generous timeout: pack → install → init → generate + MCP/browser build is slow.
    # Task 5 adds build:mcp (~30s) + build:browser (~30s) + guard spawns (~30s each).
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate token artifacts (prereq for typecheck:scripts)
        # scripts/** (verify-opacity-types.ts) and src/types/index.ts import the GITIGNORED
        # generated src/types/generated/TokenTypes.ts. `prebuild` (generate:types +
        # generate:platform-tokens) produces it. typecheck:scripts is green locally only
        # because a prior `npm run build` left the artifact in the working tree; a clean CI
        # checkout has no generated file, so the typecheck below fails to resolve the module.
        # test:consumer gets generation via `prepack: npm run build` (Increment 1), but
        # typecheck:scripts runs earlier in this lane — this step fills that gap.
        run: npm run prebuild

      - name: Typecheck build-path scripts (Spec 118 Task 9.1 / Increment 3a)
        # Restores the typecheck coverage ts-node provided for the scripts/** build-path
        # generators (generate-token-types.ts, generate-platform-tokens.ts) once ts-node
        # is retired for tsx (tsx never typechecks). tsconfig.scripts.json extends the base
        # config (inheriting its excludes) and is the ONLY thing that typechecks scripts/**.
        # Non-skippable, like the other guards — this is the R6 AC3 typecheck-gate.
        # @see tsconfig.scripts.json
        # @see Spec 118 Task 9.1 (Increment 3a — typecheck-gate FIRST, before the loader swap)
        run: npm run typecheck:scripts

      - name: Lint web component source (Spec 118 Task 4.2)
        # ESLint scoped to src/components/**/*.{ts,tsx} ONLY.
        # This is NOT a repo-wide lint run — scope discipline is critical.
        # The rule (module-resolution import-specifier) is currently INERT:
        # polarity is deferred to Group 9 after the Task 8 direction decision.
        # The step runs now so the tooling is CI-wired before polarity is set.
        # @see eslint.config.js — polarity-deferred config with scope detail
        run: npm run lint

      - name: Dynamic-import smoke guard (Spec 118 Task 4.1)
        # PREVENTIVE: asserts no web component source introduces an extensionless
        # or raw-.ts runtime dynamic import(). Scoped to src/components/**/*.{ts,tsx}.
        # Verified baseline (2026-06-24): ZERO violations — this guards future regressions.
        # Runs as a targeted jest invocation so it attaches to this lane without
        # wiring the full npm test suite into CI (which is a separate, future decision).
        run: npx jest --testPathPatterns='DynamicImportGuard' --no-coverage --runInBand

      - name: Run consumer guard
        # Runs the full consumer-integration test suite including:
        #   - Spec 106 R8: pack → install → init → generate → validate → MCP smoke
        #   - Spec 118 Task 3.1: faithful-consumer config subprocess guard
        #     (ESM-authored + CJS-authored with transitive raw-.ts my-overrides)
        run: npm run test:consumer

      # ── Spec 118 Task 5: MCP/Browser Boot/Smoke Guards ──────────────────────────
      # These guards depend on built bundles. Build them here, scoped to just the
      # bundles needed — NOT the full `npm run build` (which includes tsc + build:validate).
      # The guards run AFTER build; they skip cleanly when bundles are absent locally.

      - name: Build MCP bundles (Spec 118 Task 5.1a prerequisite)
        # esbuild bundles the three MCP servers → dist/mcp/{application,docs,product}-mcp.js
        # Prerequisite for the MCP boot/smoke guard step below.
        # @see build:mcp in package.json
        run: npm run build:mcp

      - name: Build browser bundle (Spec 118 Task 5.1b prerequisite)
        # esbuild bundles the browser entry → dist/browser/designerpunk.esm.js (+ UMD/min)
        # Prerequisite for the browser boot/smoke guard step below.
        # @see build:browser in package.json
        run: npm run build:browser

      - name: MCP boot/smoke guard (Spec 118 Task 5.1a)
        # Spawns each bundled MCP server as a subprocess, waits for its boot sentinel
        # on stderr ("running on stdio" / "Server started"), fails if the process
        # exits/errors before the sentinel (= a boot-time module-resolution error).
        # Reaches the sentinel = booted far enough to catch a resolution error.
        # Resolves Decision 2: bundled subsystems are exempt from the runtime-resolution
        # contract, but the exemption is paired with this boot/smoke guard.
        # @see tests/mcp-boot-smoke.test.ts
        run: npx jest --roots='<rootDir>/tests' --testMatch='**/mcp-boot-smoke.test.ts' --no-coverage --runInBand --testTimeout=60000

      - name: Browser bundle boot/smoke guard (Spec 118 Task 5.1b)
        # Loads the ESM bundle in a jsdom environment (customElements defined) and
        # asserts a custom element is registered (button-cta). The bundle calls
        # customElements.define() at module top-level — reaching the assertion without
        # throwing = the bundle resolved all its dependencies at build time.
        # @see tests/browser-boot-smoke.test.ts
        run: npx jest --roots='<rootDir>/tests' --testMatch='**/browser-boot-smoke.test.ts' --no-coverage --runInBand --testTimeout=60000
