# Release Analysis — post-merge on main (Spec 125-A Task 2, ballot Item 1e)
#
# Relocates the release analysis that commit-task.sh used to run at task
# completion. Merged history is the analysis's correct input: it answers "what
# has accumulated on the release line since the last release" by scanning
# summary docs via git log, so it runs on push to main (i.e., after each merge).
#
# NON-REQUIRED and NON-BLOCKING by design: this job is never added to branch
# protection's required checks, and analysis failure does not fail the run —
# preserving the old flow's fails-silently semantics. Output surfaces in the
# workflow run summary ($GITHUB_STEP_SUMMARY), one click from the run page.
#
# On-demand local detail: `npm run release:analyze`.
#
# Bake-in watch item (ballot 1e): if this output is never consulted during
# bake-in, surfacing it elsewhere (e.g., a release-PR comment) is a 125-B
# candidate.

name: Release Analysis

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  release-analysis:
    name: Release analysis (informational, non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (full history — analysis scans git log)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run release analysis into the run summary
        run: |
          {
            echo "## Release analysis (post-merge on \`main\`)"
            echo ""
            echo "Triggered by: \`${GITHUB_SHA}\` — $(printf '%s' "$COMMIT_MESSAGE" | head -1)"
            echo ""
            echo '```'
            npm run --silent release:analyze 2>&1 || echo "release:analyze failed (non-blocking — run 'npm run release:analyze' locally for detail)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message || 'manual dispatch' }}
