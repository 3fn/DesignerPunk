name: Package Name Drift Detection

# Runs the drift detection script against PRs targeting main and on pushes to main.
# Catches any reference where scope doesn't match package.json "name" scope across:
#   the directories listed in SCAN_DIRS in scripts/check-package-name-drift.js (the authoritative list)
#
# Failure blocks merge until drift is reconciled.
# See: scripts/check-package-name-drift.js
# See: .kiro/specs/101-package-publish-readiness/design-outline.md § "Scope > In scope" item 7

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  check-drift:
    # Ballot B-CI a2: this workflow already had workflow_dispatch (Spec 101 Task 1.8), so
    # a dispatch run reported under the required name today — the distinct name closes
    # that so a branch-head dispatch run can never satisfy or shadow the gate.
    name: ${{ github.event_name == 'workflow_dispatch' && 'Check package name drift (unit-branch)' || 'Check package name drift' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run drift detection
        run: npm run check:drift
