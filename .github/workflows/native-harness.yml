# native-harness.yml -- the native compile harness (Spec 129, Task 5).
#
# This is the unit branch's own copy of the file. It replaces the dispatch-only stub that
# Spec 129's stub PR put on main (record: .kiro/issues/2026-11-06-native-harness-dispatch-stub-grant.md).
# Design: .kiro/specs/129-consumer-generation-completeness/design.md § 3 "Wiring"; criteria:
# tasks.md Task 5.
#
# Jobs: `harness-generate` builds the scratch consumer once and uploads it as one artifact; the four
# compile contexts (harness-ios-tokens, harness-ios-components, harness-android-tokens,
# harness-android-components) each download it, run their lane (harness/ios/lane.ts or
# harness/android/lane.ts), then run the comparator (scripts/harness/compare.ts) on the run file the
# lane wrote. Each context fails, never skips, when harness-generate failed or its artifact is absent.
# The last step of harness-generate runs the D2 check (scripts/harness/d2-check.ts); see .kiro/issues/2026-11-07-d2-check-step-grant.md.
#
# Triggers: `pull_request` with no `paths:` filter (every unit PR runs all four contexts, Req 2.10),
# `push` to `main` (each squash that ships is measured; ballot 2026-11-08-closeout-cracks item 1), and
# `workflow_dispatch`. A dispatched or push run is not a pull request, so its comparator runs `--no-base`.
# Push runs share one concurrency group, so a burst of merges is measured at least at its newest squash.
#
# The verdict annotation: after the comparator, a step with `if: always()` reads the comparator's output
# file and writes `::notice title=harness-verdict::<verdict line>` for a PASS and a FAIL alike, and writes
# nothing when the comparator wrote no output (a job that failed before comparing). The comparator step
# runs whenever the lane wrote its run file, even when the lane step exited non-zero.
#
# No `if:` in this file reads github.event_name, github.event.*, head_ref, base_ref, ref or ref_name, and
# only one reads inputs.*: the forced-failure step of harness-generate (dispatch input
# force_generate_failure, Req 2.11's evidence run). So a context fails rather than skips on every trigger.
# Job `name:` expressions are not `if:` and read github.event_name for the "(unit-branch)" dispatch suffix
# and the "(main)" push suffix; the concurrency group reads it too. Neither is a step condition.
#
# Required context: `harness-android-tokens`, in EXPECTED_CONTEXTS since its promotion (#717,
# tools/agent-generator/verify-gate-registration.sh); the other three compile contexts are not required.
# This workflow is in complete-task.sh's REQUIRED_WORKFLOWS. A push run's `(main)` names never match a
# required context name.

name: native-harness

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_generate_failure:
        description: "Fail harness-generate on purpose, to show each compile context fails rather than skips (Req 2.11). Read by one step of harness-generate only."
        type: boolean
        default: false

permissions:
  contents: read

# Only push runs share a group; every other run has its own. GitHub keeps one running and one pending run
# per group, so in a burst the pending squash is replaced by the newest one, never the running one.
concurrency:
  group: ${{ github.event_name == 'push' && 'native-harness-push-main' || format('native-harness-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  harness-generate:
    # This name expression is a job name, not a step condition. On a dispatch it reads "(unit-branch)", the same
    # convention lane-timing.yml uses, and on a push to main "(main)", so neither run ever shadows a gate name.
    name: ${{ github.event_name == 'workflow_dispatch' && 'harness-generate (unit-branch)' || github.event_name == 'push' && 'harness-generate (main)' || 'harness-generate' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # The one step in this file whose `if:` reads a dispatch input (tasks.md Task 5). On a pull_request the
      # input is empty, so the step never runs there; every other `if:` here is event-blind.
      - name: Forced failure (dispatch input force_generate_failure)
        if: ${{ inputs.force_generate_failure }}
        run: |
          echo "::error::harness-generate failed on purpose: workflow_dispatch input force_generate_failure is true"
          exit 1

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Runs scripts/harness/consumer.ts once: npm pack, install the tarball into a scratch
      # consumer outside the repository, init, generate. The consumer root is the one
      # directory the compile contexts download (Req 2.1; tasks.md Task 1).
      - name: Build the scratch consumer (scripts/harness/consumer.ts)
        run: npx tsx scripts/harness/consumer.ts --out "${RUNNER_TEMP}/harness-consumer"

      - name: Upload the consumer root
        uses: actions/upload-artifact@v4
        with:
          name: harness-consumer
          path: ${{ runner.temp }}/harness-consumer
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

      # The D2 check (Req 1.3, with its completeness half, Req 5.10), run by the invocation contract of
      # .kiro/issues/2026-11-07-d2-check-step-grant.md. The step has no `if:`, `continue-on-error` or
      # `working-directory`. It annotates in its own shell because a failing step stops before any later one:
      # a notice per PASS line, an error per FAIL line and for the setup line, "no d2-check line" when the script
      # printed none, and on every run one exit annotation (exit code, contract lines matched) that outlives the logs.
      # The step fails on a non-zero exit, or when any of the three verdict lines is missing or reads FAIL.
      - name: D2 check (scripts/harness/d2-check.ts)
        run: |
          set +e
          out=$(npx tsx scripts/harness/d2-check.ts --consumer "${RUNNER_TEMP}/harness-consumer")
          status=$?
          set -e
          printf '%s\n' "$out"
          matched=0
          bad=0
          for k in completeness ios android; do
            line=$(printf '%s\n' "$out" | grep "^d2-check $k: " | head -n 1 || true)
            if [ -z "$line" ]; then bad=1; continue; fi
            matched=$((matched + 1))
            case "$line" in
              "d2-check $k: PASS"*) echo "::notice title=d2-check::$line" ;;
              *) echo "::error title=d2-check::$line"; bad=1 ;;
            esac
          done
          line=$(printf '%s\n' "$out" | grep '^d2-check: FAIL setup (' | head -n 1 || true)
          if [ -n "$line" ]; then echo "::error title=d2-check::$line"; fi
          if [ -z "$(printf '%s\n' "$out" | grep '^d2-check' || true)" ]; then
            echo "::error title=d2-check::no d2-check line"
          fi
          if [ "$status" -eq 0 ] && [ "$bad" -eq 0 ]; then
            echo "::notice title=d2-check::exit=$status lines=$matched/3"
          else
            echo "::error title=d2-check::exit=$status lines=$matched/3"
            exit 1
          fi

  # ---------------------------------------------------------------------------------------------
  # iOS
  # ---------------------------------------------------------------------------------------------

  harness-ios-tokens:
    name: ${{ github.event_name == 'workflow_dispatch' && 'harness-ios-tokens (unit-branch)' || github.event_name == 'push' && 'harness-ios-tokens (main)' || 'harness-ios-tokens' }}
    needs: harness-generate
    if: ${{ !cancelled() }}
    runs-on: macos-26
    timeout-minutes: 30
    env:
      CONTEXT: harness-ios-tokens
      EVENT_NAME: ${{ github.event_name }}
    steps:
      - name: Require harness-generate
        env:
          GENERATE_RESULT: ${{ needs.harness-generate.result }}
        run: |
          if [ "$GENERATE_RESULT" != "success" ]; then
            echo "::error::harness-generate result is '$GENERATE_RESULT'; this context fails rather than skips"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Download the consumer root
        uses: actions/download-artifact@v4
        with:
          name: harness-consumer
          path: ${{ runner.temp }}/harness-consumer

      - name: Lane (harness/ios/lane.ts)
        run: npx tsx harness/ios/lane.ts "$CONTEXT" --consumer "${RUNNER_TEMP}/harness-consumer" --out "${GITHUB_WORKSPACE}/harness-out"

      - name: Comparator (scripts/harness/compare.ts)
        if: ${{ !cancelled() && hashFiles('harness-out/run.json') != '' }}
        run: |
          set -o pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then BASE="--base HEAD^1"; else BASE="--no-base"; fi
          npx tsx scripts/harness/compare.ts --context "$CONTEXT" --run harness-out/run.json $BASE 2>&1 | tee harness-out/compare.txt

      - name: Verdict annotation
        if: always()
        run: |
          if [ -f harness-out/compare.txt ]; then
            line=$(grep '^harness-verdict:' harness-out/compare.txt | tail -n 1 || true)
            if [ -n "$line" ]; then echo "::notice title=harness-verdict::$line"; fi
          fi

      - name: Upload the lane output (logs, run file, comparator output)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harness-out-harness-ios-tokens
          path: harness-out
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7

  harness-ios-components:
    name: ${{ github.event_name == 'workflow_dispatch' && 'harness-ios-components (unit-branch)' || github.event_name == 'push' && 'harness-ios-components (main)' || 'harness-ios-components' }}
    needs: harness-generate
    if: ${{ !cancelled() }}
    runs-on: macos-26
    timeout-minutes: 30
    env:
      CONTEXT: harness-ios-components
      EVENT_NAME: ${{ github.event_name }}
    steps:
      - name: Require harness-generate
        env:
          GENERATE_RESULT: ${{ needs.harness-generate.result }}
        run: |
          if [ "$GENERATE_RESULT" != "success" ]; then
            echo "::error::harness-generate result is '$GENERATE_RESULT'; this context fails rather than skips"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Download the consumer root
        uses: actions/download-artifact@v4
        with:
          name: harness-consumer
          path: ${{ runner.temp }}/harness-consumer

      - name: Lane (harness/ios/lane.ts)
        run: npx tsx harness/ios/lane.ts "$CONTEXT" --consumer "${RUNNER_TEMP}/harness-consumer" --out "${GITHUB_WORKSPACE}/harness-out"

      - name: Comparator (scripts/harness/compare.ts)
        if: ${{ !cancelled() && hashFiles('harness-out/run.json') != '' }}
        run: |
          set -o pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then BASE="--base HEAD^1"; else BASE="--no-base"; fi
          npx tsx scripts/harness/compare.ts --context "$CONTEXT" --run harness-out/run.json $BASE 2>&1 | tee harness-out/compare.txt

      - name: Verdict annotation
        if: always()
        run: |
          if [ -f harness-out/compare.txt ]; then
            line=$(grep '^harness-verdict:' harness-out/compare.txt | tail -n 1 || true)
            if [ -n "$line" ]; then echo "::notice title=harness-verdict::$line"; fi
          fi

  # ---------------------------------------------------------------------------------------------
  # Android
  # ---------------------------------------------------------------------------------------------

      - name: Upload the lane output (logs, run file, comparator output)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harness-out-harness-ios-components
          path: harness-out
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7

  harness-android-tokens:
    name: ${{ github.event_name == 'workflow_dispatch' && 'harness-android-tokens (unit-branch)' || github.event_name == 'push' && 'harness-android-tokens (main)' || 'harness-android-tokens' }}
    needs: harness-generate
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CONTEXT: harness-android-tokens
      EVENT_NAME: ${{ github.event_name }}
    steps:
      - name: Require harness-generate
        env:
          GENERATE_RESULT: ${{ needs.harness-generate.result }}
        run: |
          if [ "$GENERATE_RESULT" != "success" ]; then
            echo "::error::harness-generate result is '$GENERATE_RESULT'; this context fails rather than skips"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Select JDK 17 (the image default, JAVA_HOME_17_X64)
        run: |
          echo "JAVA_HOME=${JAVA_HOME_17_X64}" >> "$GITHUB_ENV"
          echo "${JAVA_HOME_17_X64}/bin" >> "$GITHUB_PATH"

      - name: Download the consumer root
        uses: actions/download-artifact@v4
        with:
          name: harness-consumer
          path: ${{ runner.temp }}/harness-consumer

      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Restore the Gradle cache
        id: gradle-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: harness-gradle-${{ runner.os }}-${{ hashFiles('harness/android/gradle/libs.versions.toml', 'harness/android/gradle/wrapper/gradle-wrapper.properties', 'harness/pins.yaml') }}

      - name: Cache state
        env:
          CACHE_HIT: ${{ steps.gradle-cache.outputs.cache-hit }}
        run: |
          if [ "$CACHE_HIT" = "true" ]; then state=hit; else state=miss; fi
          echo "::notice title=cache::$state"

      - name: Lane self-test (harness/android/lane.ts --selftest)
        run: npx tsx harness/android/lane.ts --selftest --work "${GITHUB_WORKSPACE}/harness-out/selftest"

      - name: Lane (harness/android/lane.ts)
        run: npx tsx harness/android/lane.ts --consumer "${RUNNER_TEMP}/harness-consumer" --work "${GITHUB_WORKSPACE}/harness-out"

      - name: Comparator (scripts/harness/compare.ts)
        if: ${{ !cancelled() && hashFiles('harness-out/run-harness-android-tokens.json') != '' }}
        run: |
          set -o pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then BASE="--base HEAD^1"; else BASE="--no-base"; fi
          npx tsx scripts/harness/compare.ts --context "$CONTEXT" --run harness-out/run-harness-android-tokens.json $BASE 2>&1 | tee harness-out/compare.txt

      # Verdicts name their side. The comparator ran: harness-verdict, read only from compare.txt. The lane
      # found an environment fault in its resolve step (harness-out/infra.json) and no comparator ran:
      # harness-infra, with the host, the status and the step. The two branches are exclusive.
      - name: Verdict annotation
        if: always()
        run: |
          if [ -f harness-out/compare.txt ]; then
            line=$(grep '^harness-verdict:' harness-out/compare.txt | tail -n 1 || true)
            if [ -n "$line" ]; then echo "::notice title=harness-verdict::$line"; fi
          elif [ -f harness-out/infra.json ] || [ -f harness-out/selftest/infra.json ]; then
            f=harness-out/infra.json; [ -f "$f" ] || f=harness-out/selftest/infra.json
            node -e 'const j = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")); console.log("::notice title=harness-infra::" + j.host + " " + j.status + " " + j.step);' "$f"
          fi

      # actions/cache saves only when the job succeeds, and these contexts fail while the generator's output
      # does not compile, so a restore-and-save pair would read `miss` on every run. This step saves after a
      # failed job too, but only when the lane's resolve step succeeded (harness-out/resolved.ok exists) and
      # the key was not restored: a build that never resolved its dependencies saves nothing.
      # `hit` therefore means: an earlier run, passing or failing, resolved this key's dependencies and saved it.
      - name: Save the Gradle cache
        if: ${{ always() && steps.gradle-cache.outputs.cache-hit != 'true' && hashFiles('harness-out/resolved.ok') != '' }}
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: harness-gradle-${{ runner.os }}-${{ hashFiles('harness/android/gradle/libs.versions.toml', 'harness/android/gradle/wrapper/gradle-wrapper.properties', 'harness/pins.yaml') }}

      # Spec 129 Task 20 (U7a): the default config name compiles. A second `generate` in a copy of the consumer with
      # no top-level `name`, then :tokens and :probe (given only ProbeFamily.kt) under `DesignerPunk`, the one name
      # where the theme type and the provider function share a name in one package. HarnessConsumer stays as it
      # is above. The step has no `if:` and no `continue-on-error`; it sits after "Save the Gradle cache" so the
      # saved cache is unchanged, and writes only under harness-out/default-name/. It annotates in its own shell
      # because a failing step stops before any later one.
      - name: Default-name compile (harness/android/lane.ts --default-name)
        run: |
          set +e
          out=$(npx tsx harness/android/lane.ts --default-name --consumer "${RUNNER_TEMP}/harness-consumer" --work "${GITHUB_WORKSPACE}/harness-out/default-name" 2>&1)
          status=$?
          set -e
          printf '%s\n' "$out"
          line=$(printf '%s\n' "$out" | grep '^default-name:' | tail -n 1 || true)
          if [ -z "$line" ]; then
            echo "::error title=default-name::no default-name line"
            exit 1
          fi
          if [ "$status" -eq 0 ]; then
            echo "::notice title=default-name::$line"
          else
            echo "::error title=default-name::$line"
            exit 1
          fi

      - name: Upload the lane output (logs, run file, comparator output)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harness-out-harness-android-tokens
          path: harness-out
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7

  harness-android-components:
    name: ${{ github.event_name == 'workflow_dispatch' && 'harness-android-components (unit-branch)' || github.event_name == 'push' && 'harness-android-components (main)' || 'harness-android-components' }}
    needs: harness-generate
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CONTEXT: harness-android-components
      EVENT_NAME: ${{ github.event_name }}
    steps:
      - name: Require harness-generate
        env:
          GENERATE_RESULT: ${{ needs.harness-generate.result }}
        run: |
          if [ "$GENERATE_RESULT" != "success" ]; then
            echo "::error::harness-generate result is '$GENERATE_RESULT'; this context fails rather than skips"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Select JDK 17 (the image default, JAVA_HOME_17_X64)
        run: |
          echo "JAVA_HOME=${JAVA_HOME_17_X64}" >> "$GITHUB_ENV"
          echo "${JAVA_HOME_17_X64}/bin" >> "$GITHUB_PATH"

      - name: Download the consumer root
        uses: actions/download-artifact@v4
        with:
          name: harness-consumer
          path: ${{ runner.temp }}/harness-consumer

      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Restore the Gradle cache
        id: gradle-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: harness-gradle-${{ runner.os }}-${{ hashFiles('harness/android/gradle/libs.versions.toml', 'harness/android/gradle/wrapper/gradle-wrapper.properties', 'harness/pins.yaml') }}

      - name: Cache state
        env:
          CACHE_HIT: ${{ steps.gradle-cache.outputs.cache-hit }}
        run: |
          if [ "$CACHE_HIT" = "true" ]; then state=hit; else state=miss; fi
          echo "::notice title=cache::$state"

      - name: Lane (harness/android/lane.ts)
        run: npx tsx harness/android/lane.ts --consumer "${RUNNER_TEMP}/harness-consumer" --work "${GITHUB_WORKSPACE}/harness-out"

      - name: Comparator (scripts/harness/compare.ts)
        if: ${{ !cancelled() && hashFiles('harness-out/run-harness-android-components.json') != '' }}
        run: |
          set -o pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then BASE="--base HEAD^1"; else BASE="--no-base"; fi
          npx tsx scripts/harness/compare.ts --context "$CONTEXT" --run harness-out/run-harness-android-components.json $BASE 2>&1 | tee harness-out/compare.txt

      # Verdicts name their side. The comparator ran: harness-verdict, read only from compare.txt. The lane
      # found an environment fault in its resolve step (harness-out/infra.json) and no comparator ran:
      # harness-infra, with the host, the status and the step. The two branches are exclusive.
      - name: Verdict annotation
        if: always()
        run: |
          if [ -f harness-out/compare.txt ]; then
            line=$(grep '^harness-verdict:' harness-out/compare.txt | tail -n 1 || true)
            if [ -n "$line" ]; then echo "::notice title=harness-verdict::$line"; fi
          elif [ -f harness-out/infra.json ] || [ -f harness-out/selftest/infra.json ]; then
            f=harness-out/infra.json; [ -f "$f" ] || f=harness-out/selftest/infra.json
            node -e 'const j = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")); console.log("::notice title=harness-infra::" + j.host + " " + j.status + " " + j.step);' "$f"
          fi

      # actions/cache saves only when the job succeeds, and these contexts fail while the generator's output
      # does not compile, so a restore-and-save pair would read `miss` on every run. This step saves after a
      # failed job too, but only when the lane's resolve step succeeded (harness-out/resolved.ok exists) and
      # the key was not restored: a build that never resolved its dependencies saves nothing.
      # `hit` therefore means: an earlier run, passing or failing, resolved this key's dependencies and saved it.
      - name: Save the Gradle cache
        if: ${{ always() && steps.gradle-cache.outputs.cache-hit != 'true' && hashFiles('harness-out/resolved.ok') != '' }}
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: harness-gradle-${{ runner.os }}-${{ hashFiles('harness/android/gradle/libs.versions.toml', 'harness/android/gradle/wrapper/gradle-wrapper.properties', 'harness/pins.yaml') }}

      - name: Upload the lane output (logs, run file, comparator output)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harness-out-harness-android-components
          path: harness-out
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7
