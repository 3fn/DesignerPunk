# Completion Criteria Parity — parent success-criteria fidelity check.
#
# Sanctioned by register row `governance/classification-map.md § "completion-
# criteria-parity"` (check_state: armed). Law: the 2026-09-19 completion-
# claims-integrity ballot (RATIFIED); build: Spec 127 U2.
#
# The check context is `completion-criteria-parity`, FIXED AT AUTHORING and
# cited on the register row. REQUIRED from the 2026-10-03 flip: the register
# row's 2026-10-03 history line records it, with the gate-bite runs (throwaway
# PR #290) and EXPECTED_CONTEXTS +1 in
# tools/agent-generator/verify-gate-registration.sh, in the same recorded
# change. Branch protection lists the context by Peter's Settings act.
# Changing this job's name, trigger or steps now changes a required gate.
#
# fetch-depth: 0 — the checker derives tasks.md authorship dates from history
# (DD2) and evaluates legacy materiality against the merge base (Req 6.3).
#
# Framing (the (d8) sentence): a green run is NOT evidence of claim honesty —
# any future reading of it as such is the error Spec 127 exists to prevent.

name: Completion Criteria Parity

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  completion-criteria-parity:
    name: completion-criteria-parity
    runs-on: ubuntu-latest
    # Pure-fs markdown scan plus per-file git authorship lookups; npm ci dominates.
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Completion criteria parity
        run: npm run check:completion-criteria-parity
