<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact — Atelier Nord</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <a class="logo" href="index.html">Atelier Nord</a>
    <nav><a href="about.html">About</a> <a href="contact.html">Contact</a></nav>
  </header>
  <main>
    <h1>Tell us about your project</h1>
    <form class="contact-form" action="https://formspree.io/f/example" method="post">
      <label for="name">Name</label>
      <input id="name" name="name" type="text" required>
      <label for="email">Email</label>
      <input id="email" name="email" type="email" required>
      <label for="message">Message</label>
      <textarea id="message" name="message" rows="6" required></textarea>
      <button class="button" type="submit">Send</button>
    </form>
  </main>
</body>
</html>
