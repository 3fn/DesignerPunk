# cutover-ledger.yaml — which agents the generator is SSOT for (design §"Repository layout").
#
# An agent is added to this ledger ONLY when its cutover PR lands (C10). Membership
# drives check coverage: the sweeps, diff-guard, and canonical-vs-truth checks apply
# to ledger members. An agent NOT in the ledger is still hand-authored and exempt.

agents:
  # U2 — Ada, the FIRST CC cutover (Task 9; RATIFIED order, Peter 2026-07-07). From this
  # entry forward the generator is SSOT for ada; her runtime artifacts
  # (.claude/agents/ada.md, .kiro/agents/ada.{json,-prompt.md}) are diff-guarded surfaces.
  - ada
  # U3 — Lina (Task 10). Generator-SSOT from this entry forward; her runtime artifacts
  # (.claude/agents/lina.md, .kiro/agents/lina.{json,-prompt.md}) are diff-guarded surfaces.
  - lina
  # U4 — Thurgood (Task 11). Generator-SSOT from this entry forward; his runtime artifacts
  # (.claude/agents/thurgood.md, .kiro/agents/thurgood.{json,-prompt.md}) are diff-guarded.
  - thurgood
  # U5 — Sparky (Task 14). FIRST-GENERATION (never CC-ported). Generator-SSOT from this
  # entry forward; his runtime artifacts (.claude/agents/sparky.md — NEW,
  # .kiro/agents/sparky.{json,-prompt.md}) are diff-guarded surfaces.
  - sparky
  # U6 — Leonardo (Task 12). The consumer/hub; ~60% on-demand trim; first non-empty skills
  # (impeccable). Generator-SSOT from this entry forward; his runtime artifacts
  # (.claude/agents/leonardo.md, .kiro/agents/leonardo.{json,-prompt.md}) are diff-guarded.
  - leonardo
