# canonical/operative-sets/stacy.yaml — operative-set records (design C16; Req 11.6.5d)
#
# Exemplar source units: A, B, C(c1), C(c2), D, E (Stacy's constructions, Req 11.6.5).
# B and E share one source unit (the owed-set pipeline) and so one record.
#
# canonicalHash = "sha256:" + hex SHA-256 over the unit's exact UTF-8 bytes, as returned by
#   partition(splitFrontmatter(<source>).body) (tools/agent-generator/{frontmatter,partition}.ts).
# Unit keys are Task 10's partition anchors, verbatim. Item `text` is the COMPLETE operative text
#   and a verbatim substring of the unit (C16); `label` is a human label only, never matched.
#   Headings are labels, never items (clause (c)). List/bullet markers and indentation are not
#   part of an item's text; multi-line items (code, tables) keep their internal bytes.
# `kind` is one of 11.6.2's five: obligation | step | member | route | command.
# `confirmer` is the C1 function of (owner, profile author = thurgood). The owner fixes and
#   confirms each unit's set (11.6.5d); the `confirmation:` note is written in the
#   confirmer's seat, never the drafter's.
# Drafted by Thurgood, Spec 123 Task 11.1 (2026-09-27) — a DRAFT until each unit's
#   `confirmation:` resolves to a committed note.
source: canonical/agents/stacy.md
owner: stacy
confirmer: stacy
units:
  # exemplar A — 30 item(s)
  "#audit-checklist":
    canonicalHash: sha256:e8a4873d6fac46e8ad81bb94168464be2bd4705494f9cb74687a79e4d8e3d221
    items:
      - id: spec-quality-1
        kind: step
        label: Spec Quality 1
        text: Does the screen/feature have a specification from Leonardo?
      - id: spec-quality-2
        kind: step
        label: Spec Quality 2
        text: Is the spec complete (component tree, state model, tokens, accessibility)?
      - id: spec-quality-3
        kind: step
        label: Spec Quality 3
        text: Are platform-specific notes included where needed?
      - id: implementation-coverage-1
        kind: step
        label: Implementation Coverage 1
        text: Have all specified platforms been implemented?
      - id: implementation-coverage-2
        kind: step
        label: Implementation Coverage 2
        text: Do implementations match the spec's component tree?
      - id: implementation-coverage-3
        kind: step
        label: Implementation Coverage 3
        text: Are deviations documented with rationale?
      - id: test-coverage-1
        kind: step
        label: Test Coverage 1
        text: Do platform implementations have tests?
      - id: test-coverage-2
        kind: step
        label: Test Coverage 2
        text: Do tests cover behavioral contracts, accessibility, and key interactions?
      - id: test-coverage-3
        kind: step
        label: Test Coverage 3
        text: Do tests follow Test-Development-Standards (naming, structure, categories)?
      - id: cross-platform-parity-1
        kind: step
        label: Cross-Platform Parity 1
        text: Do all platforms reference the same source semantic tokens for the same purposes? (Tokens are expressed in platform-native format — `var(--color-primary)` vs `Color.primary` vs `ColorPrimary` — but originate from the same source)
      - id: cross-platform-parity-2
        kind: step
        label: Cross-Platform Parity 2
        text: Do all platforms honor the same behavioral contracts?
      - id: cross-platform-parity-3
        kind: step
        label: Cross-Platform Parity 3
        text: Are platform-specific deviations intentional and documented?
      - id: cross-platform-parity-4
        kind: step
        label: Cross-Platform Parity 4
        text: Is intentional platform divergence (designed differences between platforms) distinguished from unintentional drift?
      - id: cross-platform-parity-5
        kind: step
        label: Cross-Platform Parity 5
        text: Is the visual hierarchy consistent across platforms?
      - id: documentation-1
        kind: step
        label: Documentation 1
        text: Are completion docs written for finished work?
      - id: documentation-2
        kind: step
        label: Documentation 2
        text: Are lessons learned captured and routed appropriately?
      - id: documentation-3
        kind: step
        label: Documentation 3
        text: Are structured requests to system agents complete and actionable?
      - id: process-adherence-1
        kind: step
        label: Process Adherence 1
        text: Was the feedback protocol followed for spec reviews?
      - id: process-adherence-2
        kind: step
        label: Process Adherence 2
        text: Was the Product Handoff Protocol followed during implementation? (Implementation Reports submitted, blocking flags raised properly)
      - id: process-adherence-3
        kind: step
        label: Process Adherence 3
        text: Were architectural decisions documented with rationale and counter-arguments?
      - id: process-adherence-4
        kind: step
        label: Process Adherence 4
        text: Is the commit history clean and descriptive?
      - id: lessons-learned-capture-1
        kind: step
        label: Lessons-Learned Capture 1
        text: Are discoveries being documented, or lost in conversation?
      - id: lessons-learned-capture-2
        kind: step
        label: Lessons-Learned Capture 2
        text: Are structured requests to system agents complete and actionable?
      - id: lessons-learned-capture-3
        kind: step
        label: Lessons-Learned Capture 3
        text: Are product-specific learnings captured in product context?
      - id: lessons-learned-capture-4
        kind: step
        label: Lessons-Learned Capture 4
        text: Are systemic learnings routed back to the appropriate system agent?
      - id: lessons-learned-capture-5
        kind: step
        label: Lessons-Learned Capture 5
        text: Are recurring patterns being identified and flagged for systematization?
      - id: metadata-accuracy-1
        kind: step
        label: Metadata Accuracy 1
        text: Do accumulated lessons reveal stale `whenToUse` or `whenNotToUse` entries in component metadata?
      - id: metadata-accuracy-2
        kind: step
        label: Metadata Accuracy 2
        text: Are there missing `alternatives` that lessons or spec deviations have exposed?
      - id: metadata-accuracy-3
        kind: step
        label: Metadata Accuracy 3
        text: "Do `purpose` fields match the terms product agents actually search for? (Reference: controlled vocabulary consumer search terms in the authoring guide)"
      - id: metadata-accuracy-4
        kind: step
        label: Metadata Accuracy 4
        text: Are escape hatches being tracked — have any migration triggers been met?
    confirmation: canonical/profiles/consumer/confirmations/stacy.md#audit-checklist
