  "#the-charter-cut-ratified-verbatim":
    canonicalHash: sha256:faf006560fb7d64d617114bc38e435003c2d75fcc7d07100aeb367ce7e55b191
    items:
      - id: cut-thurgood
        kind: obligation
        label: Thurgood's cut — contains, never adjudicates
        text: "**Thurgood** — Thurgood owns what completion evidence must *contain*: the standards that define it, the spec formalization that produces the criteria, the test-suite health and Civitas infrastructure that support it, the mechanical checks that enforce it, and the verification of claims whose evidence requires the steward toolset — he does **not** adjudicate whether a particular execution claim was true."
      - id: cut-stacy
        kind: obligation
        label: Stacy's cut — verifies, never authors or maintains
        text: "**Stacy** — Stacy owns execution-claims verification: auditing whether a completed task's claims match what actually shipped, on both product and system specs, and owning those findings and the events that fire them — against standards she does not author and checks she does not maintain."
    confirmation: canonical/profiles/consumer/confirmations/stacy.md#the-charter-cut-ratified-verbatim
  # exemplar D — 13 item(s)
  "#the-trigger-set-the-114-superset-table-names-never-numbers":
    canonicalHash: sha256:5055f134c5a6c6fc5ecd2f499d3eb428ff14a0679946152f88e630c0c8de3d7a
    items:
      - id: trigger-lens
        kind: member
        label: LENS
        text: "| **LENS** | The **tasks feedback round** of any spec | Verifiability review of every parent's criteria set — five questions (lifecycle amendment § 1.2), plus a sixth *(ballot 2026-09-28-parent-instrument-existence-check)*: does each path, test, command or CI context a criterion names resolve at the review base, or is a subtask of the same parent named to build it — existence only, never fit (fit is the parent-start Instruments block's); it retires to reading the mechanical pass's emissions once that pass lands. For a spec planned under the plan-time instruments standard *(ballot 2026-09-28-parent-instrument-existence-check, M4)*, question 6 reads each parent's declared `**Instruments:**` block instead: every instrument the criteria name appears in it, and — until the declared-row resolver's emissions cover them — each `exists` row resolves at the review base and each `built here` / `built earlier` row names a real subtask in plan order; existence and order only, never fit. **Not a gate; feedback entries only.** Bounded by the mirror anti-rot clause below. **Carries the does-this-span-platforms question** (ruling 5: \"what does each platform's bullet verify against?\") | Stacy |"
      - id: trigger-release
        kind: member
        label: RELEASE
        text: "| **RELEASE** | Before a version publishes / at the release tag | **Claims pass over the release delta (`git log <last-tag>..main`) — parent criteria tables vs `tasks.md` vs shipped source**. **Non-negotiable.** Paired with the release-step condition: the checklist runs the owed-set query and pastes its output, and carries Q2 guard (i)'s arming line | Stacy |"
      - id: trigger-symptom
        kind: member
        label: SYMPTOM
        text: "| **SYMPTOM** | A consumer symptom traced to \"it was reported done\" | Retrospective claims audit of the originating spec, **all ticked items**. **Non-negotiable** | Stacy |"
      - id: trigger-closeout
        kind: member
        label: CLOSEOUT
        text: "| **CLOSEOUT** | The merge of the spec's **final declared merge unit** | All the spec's parents: promised vs claimed vs shipped; the judgment residual the checker cannot reach; **natural home for the spec-level-criteria discharge — rider (a)**. **Owed by every spec closing after ratification regardless of exemption status** (ruling 3's decoupling) | Stacy |"
      - id: trigger-midpoint
        kind: member
        label: MIDPOINT
        text: "| **MIDPOINT** | The merge of the unit **declared at the tasks round** as midpoint carrier, for specs declaring ≥ 3 merge units | Same as CLOSEOUT, **scoped to parents merged so far**. Fires at most once per long spec | Stacy |"
      - id: trigger-arming
        kind: member
        label: ARMING
        text: "| **ARMING** | A new barrier arms / the required-check set changes / a CI-regime standing-scope (P1) PR merges or an issue-row grant (ballot 2026-09-27-ci-regime-standing-scope § 3) over a `.github/**` path merges (at its activating merge, and again when its fixing PR merges) | `audit:coverage-map` + `verify-gate-registration.sh`; **plus `completion-criteria-parity` dormancy** (C4-1) — you detect dormancy on the row Thurgood owns; he repairs; plus, for a P1 PR, the extent and additivity checks (ballot 2026-09-27-ci-regime-standing-scope § 2): the diff is exactly `lane-timing.yml`, `git diff --numstat` deletions `0`, the added step runs an existing `package.json` test script inside an existing required job, its floor fails on zero and selects with the step's own script or config, and `audit:coverage-map`'s lanes row for that root has cleared; for a `.github/**` issue-row grant, at activation the list names no governance-law path and names any M1-excluded act it admits, and at the fixing PR's merge its paths are a subset of the list as it stood at the activating merge (`git show <activating-merge>:<issue path>`), with `--numstat` deletions `0` on CI paths unless the grant names the act. RELEASE is the backstop, over the release delta | Stacy |"
      - id: trigger-gate
        kind: member
        label: GATE
        text: "| **GATE** | Every PR carrying a parent completion doc | `completion-criteria-parity` fires mechanically — **exhaustive, no judgment** | **Instrument** (Thurgood maintains) |"
      - id: trigger-education
        kind: member
        label: EDUCATION
        text: "| **EDUCATION** | **Every claims-pass**, via its mandatory `Standards implications: none / or list` line | The docs may be teaching the wrong thing. Thurgood reads the pass **in full**, records a one-line outcome, **mines for learnings and never grades the audit**; repair is co-drafted, authored by Thurgood | Stacy surfaces → **Thurgood** repairs |"
      - id: trigger-straggler
        kind: member
        label: STRAGGLER
        text: "| **STRAGGLER** | Ballot ratification of a law that claims bind | **Edit-site straggler sweep — did every enumerated site get applied** | Thurgood (corpus-state) |"
      - id: trigger-liveness
        kind: member
        label: LIVENESS
        text: "| **LIVENESS** | Monthly Civitas health check (staleness-triggered, not calendar) | **Meta-item only**: **\"Is the closeout-owed set empty?\"** — a query, not a recollection — **plus: did RELEASE / SYMPTOM fire in the window, and did each produce a committed record? Events without records = finding.** Plus the active-charter walk | Thurgood |"
      - id: trigger-burst
        kind: member
        label: BURST
        text: "| ~~**BURST**~~ | ~~First session after a gap; N ≥ 3 parents merged since last audit~~ | ~~Cheap sampling pass; report M3/M4/M5~~ — **RETIRED**, superseded by CLOSEOUT + MIDPOINT; its counter-argument is preserved: BURST was the only trigger firing on *nothing having happened* | ~~Stacy~~ |"
      - id: finding-routing
        kind: obligation
        label: Finding routing — two routes
        text: "**Finding routing — TWO routes, additive, never alternatives**: the **remediation route** fires on **a single instance, no threshold** — the finding goes to the **owning domain agent** (the agent whose work it lands on) as an **explicit message to the named agent, never only a file in a spec directory** — and its standards implications *additionally* travel the composed loop (the EDUCATION row)."
      - id: merge-path-status
        kind: obligation
        label: Merge-path status
        text: "**Merge-path status, non-negotiable**: **execution-claims verification is a POST-ACCEPTANCE AUDIT. No pass, at any grain, is ever a required check, a review gate, or a blocking condition on any PR.** The ground is the co-signer argument: if the verifier approves at the merge, her later audit audits her own approval. *Even with infinite availability and zero overhead, a merge-path seat would still be wrong.*"
    confirmation: canonical/profiles/consumer/confirmations/stacy.md#the-trigger-set-the-114-superset-table-names-never-numbers
  # exemplar B, E — 14 item(s). Confirmer ruling 2026-09-27: the midnight-pin comment is rationale;
