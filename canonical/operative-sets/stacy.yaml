  # exemplar D — 13 item(s)
  "#the-trigger-set-the-114-superset-table-names-never-numbers":
    canonicalHash: sha256:08619eb21d0b3f41e6e5205308394abeb6e0a88c4b26b8700fc10b6e2070c0a7
    items:
      - id: trigger-lens
        kind: member
        label: LENS
        text: "| **LENS** | The **tasks feedback round** of any spec | Verifiability review of every parent's criteria set — five questions (lifecycle amendment § 1.2). **Not a gate; feedback entries only.** Bounded by the mirror anti-rot clause below. **Carries the does-this-span-platforms question** (ruling 5: \"what does each platform's bullet verify against?\") | Stacy |"
      - id: trigger-release
        kind: member
        label: RELEASE
        text: "| **RELEASE** | Before a version publishes / at the release tag | **Claims pass over the release delta (`git log <last-tag>..main`) — parent criteria tables vs `tasks.md` vs shipped source**. **Non-negotiable.** Paired with the release-step condition: the checklist runs the owed-set query and pastes its output, and carries Q2 guard (i)'s arming line | Stacy |"
      - id: trigger-symptom
        kind: member
        label: SYMPTOM
        text: "| **SYMPTOM** | A consumer symptom traced to \"it was reported done\" | Retrospective claims audit of the originating spec, **all ticked items**. **Non-negotiable** | Stacy |"
      - id: trigger-closeout
        kind: member
        label: CLOSEOUT
        text: "| **CLOSEOUT** | The merge of the spec's **final declared merge unit** | All the spec's parents: promised vs claimed vs shipped; the judgment residual the checker cannot reach; **natural home for the spec-level-criteria discharge — rider (a)**. **Owed by every spec closing after ratification regardless of exemption status** (ruling 3's decoupling) | Stacy |"
      - id: trigger-midpoint
        kind: member
        label: MIDPOINT
        text: "| **MIDPOINT** | The merge of the unit **declared at the tasks round** as midpoint carrier, for specs declaring ≥ 3 merge units | Same as CLOSEOUT, **scoped to parents merged so far**. Fires at most once per long spec | Stacy |"
      - id: trigger-arming
        kind: member
        label: ARMING
        text: "| **ARMING** | A new barrier arms / the required-check set changes | `audit:coverage-map` + `verify-gate-registration.sh`; **plus `completion-criteria-parity` dormancy** (C4-1) — you detect dormancy on the row Thurgood owns; he repairs | Stacy |"
      - id: trigger-gate
        kind: member
        label: GATE
        text: "| **GATE** | Every PR carrying a parent completion doc | `completion-criteria-parity` fires mechanically — **exhaustive, no judgment** | **Instrument** (Thurgood maintains) |"
      - id: trigger-education
        kind: member
        label: EDUCATION
        text: "| **EDUCATION** | **Every claims-pass**, via its mandatory `Standards implications: none / or list` line | The docs may be teaching the wrong thing. Thurgood reads the pass **in full**, records a one-line outcome, **mines for learnings and never grades the audit**; repair is co-drafted, authored by Thurgood | Stacy surfaces → **Thurgood** repairs |"
      - id: trigger-straggler
        kind: member
        label: STRAGGLER
        text: "| **STRAGGLER** | Ballot ratification of a law that claims bind | **Edit-site straggler sweep — did every enumerated site get applied** | Thurgood (corpus-state) |"
      - id: trigger-liveness
        kind: member
        label: LIVENESS
        text: "| **LIVENESS** | Monthly Civitas health check (staleness-triggered, not calendar) | **Meta-item only**: **\"Is the closeout-owed set empty?\"** — a query, not a recollection — **plus: did RELEASE / SYMPTOM fire in the window, and did each produce a committed record? Events without records = finding.** Plus the active-charter walk | Thurgood |"
      - id: trigger-burst
        kind: member
        label: BURST
        text: "| ~~**BURST**~~ | ~~First session after a gap; N ≥ 3 parents merged since last audit~~ | ~~Cheap sampling pass; report M3/M4/M5~~ — **RETIRED**, superseded by CLOSEOUT + MIDPOINT; its counter-argument is preserved: BURST was the only trigger firing on *nothing having happened* | ~~Stacy~~ |"
      - id: finding-routing
        kind: obligation
        label: Finding routing — two routes
        text: "**Finding routing — TWO routes, additive, never alternatives**: the **remediation route** fires on **a single instance, no threshold** — the finding goes to the **owning domain agent** (the agent whose work it lands on) as an **explicit message to the named agent, never only a file in a spec directory** — and its standards implications *additionally* travel the composed loop (the EDUCATION row)."
      - id: merge-path-status
        kind: obligation
        label: Merge-path status
        text: "**Merge-path status, non-negotiable**: **execution-claims verification is a POST-ACCEPTANCE AUDIT. No pass, at any grain, is ever a required check, a review gate, or a blocking condition on any PR.** The ground is the co-signer argument: if the verifier approves at the merge, her later audit audits her own approval. *Even with infinite availability and zero overhead, a merge-path seat would still be wrong.*"
    confirmation: canonical/profiles/consumer/confirmations/stacy.md#the-trigger-set-the-114-superset-table-names-never-numbers
  # exemplar B, E — 15 item(s)
  "#the-owed-set-pipeline-your-command-catalogs-owed-set-entry-documented-commands-deliberately-not-a-committed-script":
    canonicalHash: sha256:e3f6f82a3b33e37b2e4862e259510551fd4c3d33b19da0357164b26f2742f837
    items:
      - id: owed-set-predicate
        kind: obligation
        label: The predicate
        text: "The predicate, verbatim: **`closeout-owed(S)`** ⟺ S's final declared unit has merged **AND** `.kiro/specs/S/completion/claims-pass.md` does not exist **AND** that merge is dated on or after the ratification date recorded in `.kiro/docs/ballots/2026-09-19-completion-claims-integrity.md`."
      - id: owed-set-emits-exclusions
        kind: obligation
        label: Emits exclusions by name
        text: "Four stages; it **emits its exclusions by name** so a wrong answer is a falsifiable count, never a healthy-looking short list:"
      - id: owed-set-ratification-resolve
        kind: command
        label: Resolve the ratification date
        text: |-
          BALLOT=.kiro/docs/ballots/2026-09-19-completion-claims-integrity.md
          RATIFIED=$(grep -m1 '^Ratified-machine: ' "$BALLOT" | awk '{print $2}')
          [ -n "$RATIFIED" ] || { echo "FATAL: cannot resolve ratification record at $BALLOT"; exit 1; }
          echo "ratification date: $RATIFIED"
      - id: owed-set-midnight-pin
        kind: obligation
        label: Boundary pinned to midnight
        text: |-
          # Boundary PINNED TO MIDNIGHT: a bare date resolves via git approxidate to the date
          # at the CURRENT time of day, silently dropping same-day-earlier merges from stage 1a
          # (CLOSEOUT pilot F-1, 2026-09-19 — the owed-set's first wrong result, repaired in all
          # three copies in one commit).
      - id: owed-set-stage-1a
        kind: step
        label: Stage 1a
        text: |-
          # Stage 1a — every spec with post-ratification merge activity on main's first-parent line
          SPECS=$(git log --first-parent --since="$RATIFIED 00:00" --name-only --pretty=format: -- '.kiro/specs/' \
                  | sed -n 's|^\.kiro/specs/\([^/]*\)/.*|\1|p' | sort -u)
          echo "specs with post-ratification merge activity: $(echo "$SPECS" | grep -c .)"
      - id: owed-set-stage-1b
        kind: step
        label: Stage 1b
        text: |-
          A=0; B=0; C=0; CLOSED=0; OWED=""
          for S in $SPECS; do
            T=".kiro/specs/$S/tasks.md"
            # Stage 1b — classify into exactly one class, units-form precedence first
            if   grep -qE '^## Declared Merge Units' "$T" 2>/dev/null \
              || grep -qE '^\*\*Merge units \(' "$T" 2>/dev/null \
              || grep -qiE '^#{2,4} .*merge unit' "$T" 2>/dev/null; then cls=a; A=$((A+1))
            else
              n=$(git log --first-parent --oneline --since="$RATIFIED 00:00" -- ".kiro/specs/$S/" | wc -l | tr -d ' ')
              if [ "$n" -le 1 ]; then cls=b; B=$((B+1)); else cls=c; C=$((C+1)); fi
            fi
      - id: owed-set-stage-2
        kind: step
        label: Stage 2
        text: |-
          # Stage 2 — the final anchor's merge commit and date
            ANCHOR=$(git log --first-parent -1 --format='%h %cs' -- ".kiro/specs/$S/")
      - id: owed-set-stage-3
        kind: step
        label: Stage 3
        text: |-
          # Stage 3 — does the closeout record exist?
            if [ -f ".kiro/specs/$S/completion/claims-pass.md" ]; then CLOSED=$((CLOSED+1))
            else OWED="$OWED  $S ($cls, anchor $ANCHOR)\n"; fi
          done
      - id: owed-set-stage-4
        kind: step
        label: Stage 4
        text: |-
          # Stage 4 — emit the owed set PLUS the enumerated exclusion counts, by name
          echo "OWED SET:"; [ -n "$OWED" ] && printf "$OWED" || echo "  (empty)"
          echo "EXCLUSIONS: $CLOSED closed; ${A}(a) / ${B}(b) / ${C}(c) per class; \
          K excluded as pre-ratification (no first-parent activity since $RATIFIED)"
      - id: owed-set-class-a
        kind: member
        label: Exclusion class (a)
        text: "**(a)** declared units in any recognized form (canonical heading → legacy bold-prose declaration → a \"merge unit\" heading, tried in that precedence order) — CLOSEOUT anchors on the final declared unit;"
      - id: owed-set-class-b
        kind: member
        label: Exclusion class (b)
        text: "**(b)** no units block, single PR — that PR is the spec's only unit (the corpus's most common shape; a stage that silently drops it produces the healthy-looking short list this enumeration makes impossible);"
      - id: owed-set-class-c
        kind: member
        label: Exclusion class (c)
        text: "**(c)** no units block, more than one PR — the anchor is the PR carrying the last parent completion doc."
      - id: owed-set-three-copies
        kind: obligation
        label: Three copies, one text
        text: This pipeline also lives at `.kiro/hooks/RELEASE-FLOW.md` step 5a (the release surface) and in Thurgood's LIVENESS health-check item; the three copies are the same text by design.
      - id: owed-set-staged-mechanization
        kind: obligation
        label: Staged mechanization pre-committed
        text: "**Staged mechanization is pre-committed**: the second wrong owed-set result noticed in ordinary use (the LIVENESS read or the release step — the named de-facto detectors) earns a committed script + a scoped grant; the publish-hook question is decided at the Q2 re-evaluation sitting."
      - id: owed-set-git-history
        kind: command
        label: Git history as provisioning
        text: "**Git history is the other half of your claims-audit provisioning** (the non-glob-able knowledge base): `git log --first-parent` for unit anchors and deltas, `git show <merge>:<path>` for shipped-at-merge state."
    confirmation: canonical/profiles/consumer/confirmations/stacy.md#the-owed-set-pipeline-your-command-catalogs-owed-set-entry-documented-commands-deliberately-not-a-committed-script
