  "#mcp-practice-notes":
    canonicalHash: sha256:64c55f317e18e344f8b476a9c73a8aff44b2ac4bca321671c415d779b2fa26f3
    items:
      - id: ground-truth-computed
        kind: obligation
        label: "Ground truth is computed at audit time"
        text: "**Ground truth is computed at audit time, never a snapshot** — your audit commands (coverage-map, mode-parity, theme-drift, coverage, the governance + gate-registration scripts) are the provisioning. A parity snapshot would blind you to the live drift you exist to catch; run the command, don't read a frozen artifact."
      - id: standards-on-demand
        kind: obligation
        label: "Standards are MCP-served on demand"
        text: "**Standards are MCP-served on-demand** — your governance references (Process-*, Test-Behavioral-Contract-Validation, completion-documentation-guide, Contract-System-Reference, Product-Token-Governance) are queried by concept/heading via the docs MCP when a finding needs a standard, not always-loaded. Test-Development-Standards is your one always-loaded law."
      - id: product-mcp-caveat
        kind: obligation
        label: "Product-MCP maturity caveat"
        text: "**Product-MCP maturity caveat** — the Product MCP is the least-mature of the three; in a design-system-source repo (not a product repo) it may return an empty index. Audit against what's populated; note when a product surface isn't yet indexed rather than treating empty as a finding."
      - id: mcp-fallback
        kind: obligation
        label: "Fallback when a server is down"
        text: "if a server is unavailable: acknowledge the limitation, fall back to reading the relevant source or governance files directly (and Grep/Glob over `.kiro/specs/**/completion/` and `docs/specs/` per your knowledge-base fallback), and check index health if queries consistently fail."
    confirmation: canonical/profiles/consumer/confirmations/stacy.md#mcp-practice-notes
