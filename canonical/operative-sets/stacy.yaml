  "#the-owed-set-pipeline-your-command-catalogs-owed-set-entry-documented-commands-deliberately-not-a-committed-script":
    canonicalHash: sha256:e3f6f82a3b33e37b2e4862e259510551fd4c3d33b19da0357164b26f2742f837
    items:
      - id: owed-set-predicate
        kind: obligation
        label: The predicate
        text: "The predicate, verbatim: **`closeout-owed(S)`** ⟺ S's final declared unit has merged **AND** `.kiro/specs/S/completion/claims-pass.md` does not exist **AND** that merge is dated on or after the ratification date recorded in `.kiro/docs/ballots/2026-09-19-completion-claims-integrity.md`."
      - id: owed-set-emits-exclusions
        kind: obligation
        label: Emits exclusions by name
        text: "Four stages; it **emits its exclusions by name** so a wrong answer is a falsifiable count, never a healthy-looking short list:"
      - id: owed-set-ratification-resolve
        kind: command
        label: Resolve the ratification date
        text: |-
          BALLOT=.kiro/docs/ballots/2026-09-19-completion-claims-integrity.md
          RATIFIED=$(grep -m1 '^Ratified-machine: ' "$BALLOT" | awk '{print $2}')
          [ -n "$RATIFIED" ] || { echo "FATAL: cannot resolve ratification record at $BALLOT"; exit 1; }
          echo "ratification date: $RATIFIED"
      - id: owed-set-stage-1a
        kind: step
        label: Stage 1a
        text: |-
          # Stage 1a — every spec with post-ratification merge activity on main's first-parent line
          SPECS=$(git log --first-parent --since="$RATIFIED 00:00" --name-only --pretty=format: -- '.kiro/specs/' \
                  | sed -n 's|^\.kiro/specs/\([^/]*\)/.*|\1|p' | sort -u)
          echo "specs with post-ratification merge activity: $(echo "$SPECS" | grep -c .)"
      - id: owed-set-stage-1b
        kind: step
        label: Stage 1b
        text: |-
          A=0; B=0; C=0; CLOSED=0; OWED=""
          for S in $SPECS; do
            T=".kiro/specs/$S/tasks.md"
            # Stage 1b — classify into exactly one class, units-form precedence first
            if   grep -qE '^## Declared Merge Units' "$T" 2>/dev/null \
              || grep -qE '^\*\*Merge units \(' "$T" 2>/dev/null \
              || grep -qiE '^#{2,4} .*merge unit' "$T" 2>/dev/null; then cls=a; A=$((A+1))
            else
              n=$(git log --first-parent --oneline --since="$RATIFIED 00:00" -- ".kiro/specs/$S/" | wc -l | tr -d ' ')
              if [ "$n" -le 1 ]; then cls=b; B=$((B+1)); else cls=c; C=$((C+1)); fi
            fi
      - id: owed-set-stage-2
        kind: step
        label: Stage 2
        text: |-
          # Stage 2 — the final anchor's merge commit and date
            ANCHOR=$(git log --first-parent -1 --format='%h %cs' -- ".kiro/specs/$S/")
      - id: owed-set-stage-3
        kind: step
        label: Stage 3
        text: |-
          # Stage 3 — does the closeout record exist?
            if [ -f ".kiro/specs/$S/completion/claims-pass.md" ]; then CLOSED=$((CLOSED+1))
            else OWED="$OWED  $S ($cls, anchor $ANCHOR)\n"; fi
          done
      - id: owed-set-stage-4
        kind: step
        label: Stage 4
        text: |-
          # Stage 4 — emit the owed set PLUS the enumerated exclusion counts, by name
          echo "OWED SET:"; [ -n "$OWED" ] && printf "$OWED" || echo "  (empty)"
          echo "EXCLUSIONS: $CLOSED closed; ${A}(a) / ${B}(b) / ${C}(c) per class; \
          K excluded as pre-ratification (no first-parent activity since $RATIFIED)"
      - id: owed-set-class-a
        kind: member
        label: Exclusion class (a)
        text: "**(a)** declared units in any recognized form (canonical heading → legacy bold-prose declaration → a \"merge unit\" heading, tried in that precedence order) — CLOSEOUT anchors on the final declared unit;"
      - id: owed-set-class-b
        kind: member
        label: Exclusion class (b)
        text: "**(b)** no units block, single PR — that PR is the spec's only unit (the corpus's most common shape; a stage that silently drops it produces the healthy-looking short list this enumeration makes impossible);"
      - id: owed-set-class-c
        kind: member
        label: Exclusion class (c)
        text: "**(c)** no units block, more than one PR — the anchor is the PR carrying the last parent completion doc."
      - id: owed-set-three-copies
        kind: obligation
        label: Three copies, one text
        text: This pipeline also lives at `.kiro/hooks/RELEASE-FLOW.md` step 5a (the release surface) and in Thurgood's LIVENESS health-check item; the three copies are the same text by design.
      - id: owed-set-staged-mechanization
        kind: obligation
        label: Staged mechanization pre-committed
        text: "**Staged mechanization is pre-committed**: the second wrong owed-set result noticed in ordinary use (the LIVENESS read or the release step — the named de-facto detectors) earns a committed script + a scoped grant; the publish-hook question is decided at the Q2 re-evaluation sitting."
      - id: owed-set-git-history
        kind: command
        label: Git history as provisioning
        text: "**Git history is the other half of your claims-audit provisioning** (the non-glob-able knowledge base): `git log --first-parent` for unit anchors and deltas, `git show <merge>:<path>` for shipped-at-merge state."
    confirmation: canonical/profiles/consumer/confirmations/stacy.md#the-owed-set-pipeline-your-command-catalogs-owed-set-entry-documented-commands-deliberately-not-a-committed-script
