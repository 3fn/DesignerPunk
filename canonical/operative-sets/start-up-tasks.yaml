#
# canonicalHash: `sha256:` + hex sha256 over the unit's exact bytes (PartitionUnit.text,
# including its trailing blank line). The operative-set-freshness sweep (13.x) must use the
# same convention, or these pins read stale on day one.
#
# Item `text`: the COMPLETE operative text, a verbatim substring of the unit (C16's one
# dependence). Item `label`: a human label only. It is never matched.
# `kind` is one of obligation | step | member | route | command (the Task 11.1 scheme; 11.6.2's
# five). List markers and indentation are not part of a single-line item's text. wait-1 is a
# multi-line item: its trigger line scopes the obligation, so its internal bytes are kept,
# including the member line's marker and indentation.
