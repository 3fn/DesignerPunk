        label: "STOP and WAIT at task completion"
        text: |-
          **WHEN reporting the completion of a task THEN you MUST:**
             - **STOP and WAIT for user authorization before starting the next task**
      - id: wait-2
        kind: obligation
        label: "no auto-proceed"
        text: |-
          Do NOT automatically proceed to the next task in the task list
      - id: wait-3
        kind: obligation
        label: "no assumed continuation"
        text: |-
          Do NOT assume the user wants you to continue
      - id: wait-4
        kind: obligation
        label: "authorization is an explicit request"
        text: |-
          User must explicitly request the next task
      - id: wait-5
        kind: member
        label: "NEVER: announce-and-start"
        text: |-
          ❌ "Task 2.2 complete. Now starting Task 2.3..."
      - id: wait-6
        kind: member
        label: "NEVER: read ahead for the next task"
        text: |-
          ❌ Automatically reading files for the next task
      - id: wait-7
        kind: member
        label: "NEVER: implement without an explicit request"
        text: |-
          ❌ Beginning implementation without explicit user request
