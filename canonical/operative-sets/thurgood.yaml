      - id: event-post-prompt
        kind: step
        label: "Post-agent-prompt-modification"
        text: "Post-agent-prompt-modification: verify prompt-to-steering-doc alignment and Agent Directory consistency."
      - id: cadence-health-check
        kind: step
        label: "The periodic health check"
        text: "Check Start Up Tasks for the governance health check date. IF it is stale past the monthly cadence, run the governance health check command, review findings and flag issues to domain agents as needed, and commit the updated date in Start Up Tasks."
      - id: return-edge
        kind: step
        label: "Return-edge review"
        text: "**Return-edge review** (the strategy→tactics→validation loop's closing edge, Spec 125-B Req 14): examine recurring required-check failure patterns for education-implicating signals — does a failure cluster indicate the docs teach the wrong thing? Flag findings to the owning domain agent."
      - id: liveness-records-not-verdicts
        kind: obligation
        label: "Read for records, never for verdicts"
        text: "**read for records, never for verdicts** — you check whether passes happened and left records; you never re-decide what a pass concluded."
      - id: liveness-owed-set
        kind: step
        label: "Is the closeout-owed set empty?"
        text: "**\"Is the closeout-owed set empty?\"** — run the owed-set pipeline below and read its output."
      - id: liveness-records
        kind: step
        label: "Events without records"
        text: "**Did RELEASE / SYMPTOM fire in the window, and did each produce a committed record? Events without records = finding.**"
      - id: liveness-release-complete
        kind: obligation
        label: "A RELEASE record needs both phases"
        text: "**A RELEASE record is complete only with both phases** (ballot 2026-10-03-hermetic-publish-path § 3.4): a record holding phase 1 alone, still reading `publish-rail liveness: owed`, and a phase 2 drafted against an open step-6 PR that lacks its merge-confirmation line, are each an event without a complete record."
      - id: liveness-charter-walk
        kind: step
        label: "The active-charter walk"
        text: "**The active-charter walk**: each live charter's named triggers — fired? / evidence? — against its pre-written criteria (minutes, not sessions; the issues-dir archive convention bounds it)."
      - id: owed-set-three-copies
        kind: obligation
        label: "Three copies, one text"
        text: "the same text lives in `.kiro/hooks/RELEASE-FLOW.md` step 5a and Stacy's command catalog — three copies, one text, by design"
      - id: owed-set-predicate
        kind: member
        label: "The closeout-owed predicate"
        text: "Predicate: **`closeout-owed(S)`** ⟺ S's final declared unit has merged **AND** `.kiro/specs/S/completion/claims-pass.md` does not exist **AND** that merge is dated on or after the ratification date recorded in `.kiro/docs/ballots/2026-09-19-completion-claims-integrity.md`. (A MIDPOINT record lives at `completion/claims-pass-midpoint.md` and does NOT discharge closeout-owed — the filename split is load-bearing.)"
      - id: owed-set-pipeline
        kind: command
        label: "The owed-set pipeline"
        text: "BALLOT=.kiro/docs/ballots/2026-09-19-completion-claims-integrity.md\n  RATIFIED=$(grep -m1 '^Ratified-machine: ' \"$BALLOT\" | awk '{print $2}')\n  [ -n \"$RATIFIED\" ] || { echo \"FATAL: cannot resolve ratification record at $BALLOT\"; exit 1; }\n  echo \"ratification date: $RATIFIED\"\n  # Boundary PINNED TO MIDNIGHT: a bare date resolves via git approxidate to the date\n  # at the CURRENT time of day, silently dropping same-day-earlier merges from stage 1a\n  # (CLOSEOUT pilot F-1, 2026-09-19 — the owed-set's first wrong result, repaired in all\n  # three copies in one commit).\n\n  # Stage 1a — every spec with post-ratification merge activity on main's first-parent line\n  SPECS=$(git log --first-parent --since=\"$RATIFIED 00:00\" --name-only --pretty=format: -- '.kiro/specs/' \\\n          | sed -n 's|^\\.kiro/specs/\\([^/]*\\)/.*|\\1|p' | sort -u)\n  echo \"specs with post-ratification merge activity: $(echo \"$SPECS\" | grep -c .)\"\n\n  A=0; B=0; C=0; CLOSED=0; OWED=\"\"\n  for S in $SPECS; do\n    T=\".kiro/specs/$S/tasks.md\"\n    # Stage 1b — classify into exactly one class, units-form precedence first\n    if   grep -qE '^## Declared Merge Units' \"$T\" 2>/dev/null \\\n      || grep -qE '^\\*\\*Merge units \\(' \"$T\" 2>/dev/null \\\n      || grep -qiE '^#{2,4} .*merge unit' \"$T\" 2>/dev/null; then cls=a; A=$((A+1))\n    else\n      n=$(git log --first-parent --oneline --since=\"$RATIFIED 00:00\" -- \".kiro/specs/$S/\" | wc -l | tr -d ' ')\n      if [ \"$n\" -le 1 ]; then cls=b; B=$((B+1)); else cls=c; C=$((C+1)); fi\n    fi\n    # Stage 2 — the final anchor's merge commit and date\n    ANCHOR=$(git log --first-parent -1 --format='%h %cs' -- \".kiro/specs/$S/\")\n    # Stage 3 — does the closeout record exist?\n    if [ -f \".kiro/specs/$S/completion/claims-pass.md\" ]; then CLOSED=$((CLOSED+1))\n    else OWED=\"$OWED  $S ($cls, anchor $ANCHOR)\\n\"; fi\n  done\n\n  # Stage 4 — emit the owed set PLUS the enumerated exclusion counts, by name\n  echo \"OWED SET:\"; [ -n \"$OWED\" ] && printf \"$OWED\" || echo \"  (empty)\"\n  echo \"EXCLUSIONS: $CLOSED closed; ${A}(a) / ${B}(b) / ${C}(c) per class; \\\n  K excluded as pre-ratification (no first-parent activity since $RATIFIED)\""
      - id: owed-set-exclusion-classes
        kind: member
        label: "The exclusion classes"
        text: "**The exclusion classes**: **(a)** declared units in any recognized form (canonical `## Declared Merge Units` heading → legacy bold-prose `**Merge units (…** declaration → a \"merge unit\" heading, in that precedence order), anchoring on the final declared unit; **(b)** no units block, single PR — that PR is the spec's only unit; **(c)** no units block, >1 PR — the PR carrying the last parent completion doc."
      - id: owed-set-promotion
        kind: obligation
        label: "Second wrong result promotes to a script"
        text: "**The second wrong owed-set result noticed in ordinary use** (this read, or the release step) **promotes the pipeline to a committed script with a scoped grant** — the pre-committed ladder's first rung."
      - id: register-read
        kind: step
        label: "The proposed-row register read"
        text: "**The proposed-row register read** (Req 5.8): list every `governance/classification-map.md` row at `check_state: proposed`, **with ages**. Nothing else walks `proposed` rows — without this line their existence reads as coverage, the exact error the register exists to prevent. Read-for-records-never-verdicts applies here too."
      - id: discovery-spec
        kind: step
        label: "Discovery during spec formalization"
        text: "During spec formalization: notice steering doc contradictions → flag"
      - id: discovery-feedback
        kind: step
        label: "Discovery during feedback rounds"
        text: "During feedback rounds: agent references outdated guidance → flag"
      - id: discovery-audit
        kind: step
        label: "Discovery during audits"
        text: "During audits: find dormant tooling → assess and activate or deprecate"
    confirmation: canonical/profiles/consumer/confirmations/thurgood.md#trigger-types
