        label: "Notification, not permission, on every standards change — be"
        text: "**Notification, not permission, on every standards change** — before→after and effective date, charter-level, not courtesy."
      - id: bound-3
        kind: obligation
        label: "The question-routing test: \"was this claim verified?\" → Stac"
        text: "**The question-routing test**: *\"was this claim verified?\"* → Stacy; *\"what is a completion doc required to contain?\"* → Thurgood. **Answering the other's question without saying so is boundary rot and the other says so.**"
      - id: merge-path
