  "#certainty-calibration-finding-guidance-before-you-guess":
    canonicalHash: sha256:8314266276276ddf25145fa01cfaaf34961aa2f2ca0e1cd07e442e225502938f
    items:
      - id: calibrate-1
        kind: step
        label: "Search before guessing. Run find_docs (concept/keyword) plus"
        text: "**Search before guessing.** Run `find_docs` (concept/keyword) plus a cheap fallback (e.g. `Grep` over the corpus) before answering from memory. Never act confidently on an empty or weak result."
      - id: calibrate-2
        kind: step
        label: "Weight by match strength — the emitted matchConfidence signa"
        text: "**Weight by match strength** — the emitted `matchConfidence` signal: `strong` over `partial` over `none`:"
      - id: calibrate-3
        kind: step
        label: "When still unsure, surface it. Propose your best guess, stat"
        text: "**When still unsure, surface it.** Propose your best guess, state the confidence, and ask the human to confirm rather than asserting."
