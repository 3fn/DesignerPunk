        text: "Run the counter-argument against your own proposal **before** presenting (the fold-back discipline, AICP § \"Counter-Argument Requirement\", ratified 2026-09-19): fold in what it genuinely improves, present the **surviving residual** plainly — an empty residual means the counter-argument was too weak, not that the proposal is safe — and surface — never pick — any fork it exposes between defensible options: the pick is the human's."
