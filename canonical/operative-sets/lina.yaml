  # exemplar Lina-2 — 5 item(s)
  "#step-3-author-contractsyaml":
    canonicalHash: sha256:4f9f38c9a48f3e78dfb958d759047f157365f119e508bdbdff7ac34e46994f3a
    items:
      - id: step3-contracts-first
        kind: obligation
        label: Define contracts before implementation
        text: Before platform implementation, define the component's behavioral contracts. This is the specification that platform implementations must satisfy.
      - id: step3-check-catalog
        kind: step
        label: Check the Concept Catalog
        text: Check the Concept Catalog for existing concepts (routed in your routing section).
      - id: step3-canonical-naming
        kind: step
        label: Author with the canonical naming convention
        text: Author contracts.yaml using the canonical naming convention — delivered as ambient law; see the Ambient section's `contract-system-reference` embed and apply it as written there.
      - id: step3-propose-new-concept
        kind: step
        label: Propose a new concept (ballot) first
        text: If a behavior doesn't map to any existing catalog concept, propose a new concept addition (ballot measure) before using it.
      - id: step3-contracts-before-code
        kind: obligation
        label: Contracts precede platform code
        text: Contracts must be authored before platform implementation begins — platform code implements the contracts, not the other way around.
    confirmation: canonical/profiles/consumer/confirmations/lina.md#step-3-author-contractsyaml
  # exemplar Lina-2 — 5 item(s)
  "#step-4-create-platform-implementations":
    canonicalHash: sha256:6aa7c9768f2d415cf6d5ff36b93f6d00641ab908c53b863bb7dcd3b063393a5c
    items:
      - id: step4-platform-separation
        kind: obligation
        label: Build-time separation under platforms/
        text: "Build-time platform separation under `platforms/`:"
      - id: step4-layout-root
        kind: member
        label: Component root files
        text: |-
          ComponentName/
            types.ts
            ComponentName.schema.yaml
            ComponentName.tokens.ts
            contracts.yaml
            component-meta.yaml
            index.ts
            README.md
      - id: step4-layout-platforms
        kind: member
        label: platforms/ subtree
        text: |-
          platforms/
              web/ComponentName.web.ts
              ios/ComponentName.ios.swift
              android/ComponentName.android.kt
      - id: step4-layout-tests
        kind: member
        label: __tests__/ subtree
        text: |-
          __tests__/
              ComponentName.test.ts
      - id: step4-layout-examples
        kind: member
        label: examples/ subtree
        text: |-
          examples/
              BasicUsage.tsx
              BasicUsage.html
    confirmation: canonical/profiles/consumer/confirmations/lina.md#step-4-create-platform-implementations
