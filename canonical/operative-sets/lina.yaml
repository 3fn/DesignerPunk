# canonical/operative-sets/lina.yaml — operative-set records (design C16; Req 11.6.5d)
#
# Exemplar source units: Lina-1 (`## Platform Implementation: True Native Architecture` — its
#   preamble and four sub-sections) and Lina-2 (`## Component Scaffolding Workflow` — its preamble
#   and seven steps), Lina's constructions (Req 11.6.5; feedback/requirements.md [LINA R1]).
# At finest grain (Task 10) each section is several units; each unit carries its own record.
#
# canonicalHash = "sha256:" + hex SHA-256 over the unit's exact UTF-8 bytes, as returned by
#   partition(splitFrontmatter(<source>).body) (tools/agent-generator/{frontmatter,partition}.ts).
# Unit keys are Task 10's partition anchors, verbatim. Item `text` is the COMPLETE operative text
#   and a verbatim substring of the unit (C16); `label` is a human label only, never matched.
#   Headings are labels, never items (clause (c)). List/bullet markers and indentation are not
#   part of an item's text; multi-line items (code, tables) keep their internal bytes.
# `kind` is one of 11.6.2's five: obligation | step | member | route | command.
# `confirmer` is the C1 function of (owner, profile author = thurgood). The owner fixes and
#   confirms each unit's set (11.6.5d); the `confirmation:` note is written in the
#   confirmer's seat, never the drafter's.
# Drafted by Thurgood, Spec 123 Task 11.1 (2026-09-27). Confirmed by Lina (owner seat, C1),
#   Task 11.2 (2026-09-27): 13 units, 39 items; two item texts corrected in #step-6-….
