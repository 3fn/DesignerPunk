  "#the-process":
    canonicalHash: sha256:7405eed001bcf70f166f07adb40e2782e8a7d16e807a54044f8f63d65c271297
    items:
      - id: ballot-propose
        kind: step
        label: "Propose"
        text: "**Propose**: When you identify that a Component-Family doc or steering doc needs updating, draft the proposed change."
      - id: ballot-present
        kind: step
        label: "Present"
        text: "**Present**: Show Peter the proposal with: what changed; why; the surviving counter-argument (what fold-back could not absorb); the impact."
      - id: ballot-vote
        kind: step
        label: "Vote"
        text: "**Vote**: Peter approves, modifies, or rejects."
      - id: ballot-apply
        kind: step
        label: "Apply"
        text: "**Apply**: If approved, apply precisely as approved. If rejected, respect the decision and document the alternative."
    confirmation: canonical/profiles/consumer/confirmations/lina.md#the-process
  "#what-this-means-in-practice":
    canonicalHash: sha256:8fb455b5399e8eebaaff5deee87ddc00be1600efb53cc9071bcca6a96d464034
    items:
      - id: practice-no-write
        kind: obligation
        label: "Never write the steering or governance layer unilaterally"
        text: "You do NOT write to `.kiro/steering/` or `governance/` files unilaterally (a behavioral rule — write-path enforcement varies by runtime; see your write scope. The one exception in your write scope, the component-meta authoring guide, still goes through this process for content changes.)"
      - id: practice-no-edit-docs
        kind: obligation
        label: "Never edit shared docs directly"
        text: "You do NOT directly edit Component-Family docs, Component-Development-Standards, or any shared knowledge doc"
      - id: practice-propose
        kind: obligation
        label: "Draft proposals; the human decides"
        text: "You draft proposals in the conversation, Peter decides"
      - id: practice-all-changes
        kind: obligation
        label: "Every documentation change"
        text: "This applies to ALL documentation changes, no matter how small — including the two steering docs whose content you maintain"
    confirmation: canonical/profiles/consumer/confirmations/lina.md#what-this-means-in-practice
  "#mcp-practice-notes":
    canonicalHash: sha256:5c767d6f46b533fa6747a6b40b284bc301dd8108cab485dc31789e12b1de472d
    items:
      - id: mcp-query-parent
        kind: obligation
        label: "Query the parent before inheriting"
        text: "Query the parent before building a component that inherits; query children before composing; verify assembly and health after creating or modifying a schema."
      - id: schema-own-tokens
        kind: obligation
        label: "Schemas list only own tokens"
        text: "schemas list only the component's OWN tokens: tokens directly consumed in its platform files."
      - id: schema-no-inherited
        kind: obligation
        label: "No inherited or composed tokens in the schema"
        text: "Inherited tokens (from the `inherits:` parent) and composed tokens (from `composition.internal` children) are NOT listed in the schema; the MCP assembles the full picture via `resolvedTokens.own` and `resolvedTokens.composed`."
      - id: schema-verify-own-code
        kind: obligation
        label: "Verify tokens in own code"
        text: "When scanning platform files for tokens, verify each token is referenced in the component's OWN code, not imported/inherited parent code."
      - id: rebuild-after-write
        kind: obligation
        label: "Rebuild after writes"
        text: "after modifying content that feeds an MCP index, trigger the matching rebuild so data is immediately fresh"
      - id: rebuild-application
        kind: route
        label: "Component changes → application rebuild"
        text: "component schemas, contracts, or component-meta.yaml → the application MCP's `rebuild_index`"
      - id: rebuild-docs
        kind: route
        label: "Doc changes → docs rebuild"
        text: "governance/component doc changes → the docs MCP's `rebuild_index`"
      - id: mcp-fallback
        kind: obligation
        label: "Fallback when a server is down"
        text: "if a server is unavailable: acknowledge the limitation, fall back to reading schema.yaml and types.ts directly (and Grep over `src/components/` or `application-mcp-server/`), and check index health if queries consistently fail."
    confirmation: canonical/profiles/consumer/confirmations/lina.md#mcp-practice-notes
