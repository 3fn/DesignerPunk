  "#completion-state-in-the-pr-flow:preamble":
    canonicalHash: sha256:b59a35369cc72af0278db7c994f6fcdd75e5dc9202494bcc80a59ec96bb9c955
    items:
      - id: completion-state-in--1
        kind: obligation
        label: "Branch → PR → required checks → merge."
        text: "Branch → PR → required checks → merge."
      - id: merge-unit-definition
        kind: member
        label: "The merge unit is the coherent unit"
        text: "**The merge unit is the coherent unit.** A PR carries a **coherent unit** — the smallest chunk of a spec's work that is coherent on its own AND reviewable as a single diff. For a small spec the unit is the whole spec (one PR)."
      - id: completion-state-in--2
        kind: obligation
        label: "For a large spec the units are declared in that spec's own t"
        text: "For a large spec the units are **declared in that spec's own tasks.md** as a task grouping (e.g., a substrate group / each per-agent cutover / a closeout) — named up front, never judged at merge time."
      - id: one-branch-per-unit
        kind: obligation
        label: "One branch per unit; Peter merges the unit"
        text: "One branch per unit; the unit's completion opens the PR; Peter merges the unit."
      - id: completion-state-in--3
        kind: obligation
        label: "Work happens on a task branch, never on main. The branch is "
        text: "Work happens on a **task branch**, never on `main`. The branch is created at the task's first subtask (or at task start): plain `git switch -c task/<spec>-<N>-<slug>`, or the completion tooling's equivalent."
      - id: completion-state-in--4
        kind: obligation
        label: "Subtask mechanics (one rule — commit method, push semantics,"
        text: "**Subtask mechanics** (one rule — commit method, push semantics, branch creation, PR timing): subtask commits are **optional and judgment-based, not mechanical per subtask** — and when made, they **commit AND push the branch through the completion tooling** (`complete-task.sh --subtask`, which also dispatches the required workflows — see Hook ergonomics; the two stay coupled; the push is the off-machine backup). A plain-git push is not a checkpoint: it dispatches nothing. Commit-and-push at a **checkpoint** (delicate or potentially-breaking work), when **backup-worthy work has accumulated** (a unit branch is longer-lived than a single task — push before the unpushed pile grows), or at a **session/handoff boundary** — not after every trivial subtask, since the unit squash-merges anyway and subtask granularity is cosmetic to `main`. No PR opens until unit completion; subtasks do NOT open PRs. **Required workflows are dispatched against the unit branch** at each subtask checkpoint and each non-final parent completion that the completion tooling fires (a subtask checkpoint may pass `--no-ci`). Those runs are **feedback, not the gate**: they report under non-required context names and test the branch head, not the merge ref. The gate runs on the unit PR."
      - id: completion-state-in--6
        kind: obligation
        label: "Hook ergonomics: one completion command, context-aware (./.k"
        text: "**Hook ergonomics**: one completion command, context-aware (`./.kiro/hooks/complete-task.sh`) — invoked for a subtask (at a judgment-based checkpoint, not mechanically) it commits and pushes the branch and dispatches the required workflows against it, printing the run URLs (no PR; `--no-ci` skips the dispatch); invoked for a parent that is NOT the unit's final parent it commits the completion docs on the branch, pushes, and dispatches the required workflows (no PR); invoked at **unit completion** (a single-parent unit, or the final/gating parent of a multi-parent unit) it commits, pushes, and opens the PR, then **fails loudly — non-zero exit, with the remedy printed — if CI started zero runs on it** (the #148/#194 dropped-event class)."
      - id: completion-state-in--7
        kind: obligation
        label: "Dependent tasks branch from main after the prior task's PR m"
        text: "**Dependent tasks branch from `main` after the prior task's PR merges.** Starting a dependent task before the prior merge is not sanctioned by default — this composes with stop-and-wait (Peter's go for the next task typically follows his merge of the prior one), so the wait costs nothing in practice. Exception, only on Peter's explicit direction: branch from the prior task branch and declare `Stacked-on: #<PR>` in the PR body; stacked PRs merge in base-first order."
      - id: completion-state-in--8
        kind: obligation
        label: "At unit completion (a standalone task, a small single-unit s"
        text: "At **unit** completion (a standalone task, a small single-unit spec, or the final/gating parent of a declared multi-parent unit), the tooling commits, pushes the branch, **opens a PR**, and reports the PR URL. A parent completing *inside* a multi-parent unit commits its completion+summary docs on the branch and does NOT open a PR — its acceptance is the unit's merge."
      - id: completion-state-in--9
        kind: obligation
        label: "Required checks run on the PR. A failing check blocks merge "
        text: "Required checks run on the PR. A failing check blocks merge at the platform."
      - id: completion-state-in--10
        kind: obligation
        label: "Peter merges on green (see The Merge Rule below). The reposi"
        text: "**Peter merges on green** (see The Merge Rule below). The repository is configured **squash-merge-only** (method drift closed by configuration, not convention). The PR collapses to one commit on `main`, preserving the atomic-commit-per-unit history that serves as the release changelog spine; the PR title becomes the commit subject."
      - id: completion-state-in--11
        kind: obligation
        label: "Direct pushes to main are rejected by branch protection, adm"
        text: "Direct pushes to `main` are rejected by branch protection, **admins included**."
      - id: complete-at-merge
        kind: obligation
        label: "Complete at merge, not at PR-open"
        text: "**A task is complete at MERGE, not at PR-open.** The PR is the submission; the merge is the acceptance."
      - id: completion-state-in--12
        kind: obligation
        label: "The agent finishes the work and runs tier-appropriate valida"
        text: "The agent finishes the work and runs tier-appropriate validation locally."
      - id: completion-state-in--13
        kind: obligation
        label: "Completion documentation (and the summary doc, for parent ta"
        text: "Completion documentation (and the summary doc, for parent tasks) is written **on the task branch** — it traverses the gate with the work it documents."
      - id: completion-state-in--14
        kind: obligation
        label: "The agent marks the task complete (taskStatus tool / tasks.m"
        text: "The agent marks the task complete (`taskStatus` tool / tasks.md checkbox) **on the branch** — the status change is part of the work product and lands with it. For a parent *inside* a multi-parent unit this happens at parent completion (docs + status on the branch, no PR); for the unit's final parent it happens before the PR opens. Until the UNIT merges, every such status is an assertion awaiting acceptance, not a fact about `main`."
      - id: completion-state-in--15
        kind: obligation
        label: "The agent opens the PR, reports the PR URL, and STOPS. Openi"
        text: "The agent opens the PR, **reports the PR URL, and STOPS.** Opening a PR is submission for authorization, not completion."
      - id: completion-state-in--16
        kind: obligation
        label: "Peter's merge is the authorization act. It accepts the whole"
        text: "**Peter's merge is the authorization act.** It accepts the whole UNIT — every task in it AND their completion claims — into `main` in one platform-verified action. A parent task inside a multi-parent unit is **done-on-branch** at its own completion and **accepted at the unit's merge**; the unit merge is the single acceptance event."
      - id: completion-state-in--17
        kind: obligation
        label: "Stop-and-wait composes unchanged: authorization to START the"
        text: "**Stop-and-wait composes unchanged**: authorization to START the next task remains a separate, explicit grant (Start Up Tasks #3). A merge accepts the finished task; it does not, by itself, instruct the agent to begin the next one. Direction for what follows typically arrives with or after the merge; absent it, the agent remains stopped."
      - id: completion-state-in--18
        kind: obligation
        label: "A change request is authorization to resume, not a completio"
        text: "**A change request is authorization to resume, not a completion.** If Peter reviews the PR and requests changes instead of merging, the change request authorizes the agent to resume on that branch: fix, push, re-report the PR URL, and STOP again."
      - id: completion-state-in--19
        kind: obligation
        label: "If required checks fail, the task is not complete and not me"
        text: "If required checks fail, the task is not complete and not mergeable: fix on the same branch. If the PR is green but unmergeable (the branch conflicts with an advanced `main`), update the branch from `main` on the same branch. Every push re-runs the checks."
      - id: completion-state-in--20
        kind: obligation
        label: "A checks-only merge is NOT ratification. For governance-law "
        text: "**A checks-only merge is NOT ratification.** For governance-law changes, the record-first ballot protocol (`.kiro/docs/ballots/README.md`) remains the ratification mechanism throughout 125-A — the gate verifies mechanics, not authority. PR-approval-as-ratification arrives with 125-B's CODEOWNERS layer."
    confirmation: canonical/profiles/consumer/confirmations/task-completion-protocol.md#completion-state-in-the-pr-flow:preamble
  "#coherent-units-the-merge-granularity":
    canonicalHash: sha256:4bd3b64a6e82bcdcc9065d9eb7c42162e1da6c6fbd00988fa2d3f74137684632
    items:
      - id: coherent-units-the-m-1
        kind: obligation
        label: "What a unit is: the smallest chunk of a spec that is coheren"
        text: "**What a unit is**: the smallest chunk of a spec that is coherent on its own AND reviewable as a single diff. The merge of a unit's PR is the completion event for every task the unit contains."
      - id: coherent-units-the-m-2
        kind: obligation
        label: "Small spec → one unit → one PR (the default and common case;"
        text: "**Small spec → one unit → one PR** (the default and common case; equals the 125-A single-parent behavior)."
      - id: coherent-units-the-m-3
        kind: obligation
        label: "Large spec → units DECLARED in tasks.md: the spec's tasks.md"
        text: "**Large spec → units DECLARED in tasks.md**: the spec's tasks.md names its units as a task grouping (substrate / each cutover / closeout, etc.). Units are named up front and reviewed in the tasks feedback round — never judged at merge time."
      - id: coherent-units-the-m-4
        kind: obligation
        label: "One branch per unit: subtasks commit+push the branch at judg"
        text: "**One branch per unit**: subtasks commit+push the branch at judgment-based checkpoints (not mechanically per subtask); parent completions commit their docs on the branch; the unit's completion opens the PR; Peter merges (squash)."
      - id: coherent-units-the-m-5
        kind: obligation
        label: "Dependent units branch from main after the prior unit's PR m"
        text: "**Dependent units branch from `main` after the prior unit's PR merges** — the unit is the dependency grain (stacking only on Peter's explicit direction, `Stacked-on: #<PR>`)."
      - id: coherent-units-the-m-6
        kind: obligation
        label: "Write scope inside a unit: a parent's assignment row in a me"
        text: "**Write scope inside a unit**: a parent's assignment row in a **merged** `tasks.md` grants its PRIMARY and tiered secondary agents write access to **exactly that parent's listed Primary Artifacts**, on the unit's branch, until the unit merges. It supplements the charter's write scope, grants no ratification authority, and an out-of-list edit is a claims-pass finding. Rule and limits: `.kiro/docs/ballots/2026-09-26-tasks-row-write-scope-grant.md` (register row `tasks-row-write-scope-grant`)."
      - id: coherent-units-the-m-7
        kind: obligation
        label: "On merge, the unit's branch is deleted (remote auto-deleted "
        text: "**On merge, the unit's branch is deleted** (remote auto-deleted by repo setting; local deleted on return to `main`); stale/unmerged branches are swept in the monthly Civitas health check — see § \"Branch Cleanup\"."
    confirmation: canonical/profiles/consumer/confirmations/task-completion-protocol.md#coherent-units-the-merge-granularity
  "#branch-cleanup":
    canonicalHash: sha256:f6e97dd4c99e8e9e2143a984ccf2fb4b85e62a04da4965d0a6f01fc341c4ff8e
    items:
      - id: branch-cleanup-1
        kind: obligation
        label: "On merge — remote branch auto-deleted. GitHub's \"Automatical"
        text: "**On merge — remote branch auto-deleted.** GitHub's **\"Automatically delete head branches\"** repo setting is enabled, so every squash-merge removes the merged unit's remote branch. This is a **repo Settings toggle Peter enables** (Settings → General), a config action like branch protection and squash-only — not something an agent commits."
      - id: branch-cleanup-2
        kind: obligation
        label: "On merge — local branch deleted. On returning to main after "
        text: "**On merge — local branch deleted.** On returning to `main` after a merge, the completion tooling / agent deletes the merged local unit branch (`git branch -d <branch>`)."
      - id: branch-cleanup-3
        kind: obligation
        label: "Stale/unmerged branches (abandoned or superseded units) are "
        text: "**Stale/unmerged branches** (abandoned or superseded units) are pruned as part of the **monthly Civitas health check** (Thurgood's cadence). This prevents the failure mode where one long-lived branch quietly accumulates unrelated later work into a tangled divergence from `main`."
      - id: branch-cleanup-4
        kind: obligation
        label: "Tooling follow-up (optional): complete-task.sh may auto-prun"
        text: "**Tooling follow-up (optional)**: `complete-task.sh` may auto-prune the local unit branch once it detects the merge — a convenience, not a hard requirement; the manual `git branch -d` step is not blocked on it."
    confirmation: canonical/profiles/consumer/confirmations/task-completion-protocol.md#branch-cleanup
  "#branch-and-pr-conventions":
    canonicalHash: sha256:920fbf9e608725a083053d158bcb195209a2993b1e00037764621cbf1a71b2cf
    items:
      - id: branch-and-pr-conven-1
        kind: obligation
        label: "The <spec> token, defined once: everywhere in this law, <spe"
        text: "**The `<spec>` token, defined once**: everywhere in this law, `<spec>` is the **spec ID** — the leading identifier segment of the spec directory name (`125-A` from `125-A-pr-gate-mechanical-arming`; `052` from `052-badge-count-base`). Branch names and PR titles use the spec ID; the PR body's `Spec:` field carries the full directory name."
      - id: branch-and-pr-conven-2
        kind: obligation
        label: "Branch names: task/<spec>-<task-number>-<short-slug> for spe"
        text: "**Branch names**: `task/<spec>-<task-number>-<short-slug>` for spec tasks (e.g., `task/125-A-2-commit-task-rework`, `task/052-4-web-implementation`); `fix/<slug>` or `chore/<slug>` for non-spec work."
      - id: branch-and-pr-conven-3
        kind: obligation
        label: "PR title = the commit-message standard, spec-suffixed: Task "
        text: "**PR title** = the commit-message standard, spec-suffixed: `Task <N> Complete: <Description> (<spec>)` (e.g., `Task 2 Complete: Rework task tooling for PR flow (125-A)`). Because squash-merge makes the title the commit subject, title discipline IS commit-message discipline."
      - id: branch-and-pr-conven-4
        kind: obligation
        label: "PR body MUST carry: Spec: (spec directory name), Task: (task"
        text: "**PR body** MUST carry: `Spec:` (spec directory name), `Task:` (task number + name), `Agent:` (authoring agent, or `Peter` for human-direct work), path(s) to the completion doc(s) on the branch, and a one-line validation note (which tier/commands ran locally)."
      - id: branch-and-pr-conven-5
        kind: obligation
        label: "Unit-grain naming (multi-parent units): a unit spanning mult"
        text: "**Unit-grain naming (multi-parent units)**: a unit spanning multiple parents uses a unit slug — branch `task/<spec>-<unit-slug>` (e.g., `task/122-substrate`, `task/122-cutover-ada`); PR title `<Unit description> (<spec>)`. A single-parent unit keeps the unchanged `task/<spec>-<N>-<slug>` branch and `Task <N> Complete: <Description> (<spec>)` title."
      - id: branch-and-pr-conven-6
        kind: obligation
        label: "PR body additionally carries a Unit: field (the declared mer"
        text: "**PR body** additionally carries a `Unit:` field (the declared merge unit, or the task for single-parent units) alongside the existing `Spec:` / `Task:` / `Agent:` / completion-doc-path / validation-note fields."
    confirmation: canonical/profiles/consumer/confirmations/task-completion-protocol.md#branch-and-pr-conventions
