        label: "If this parent is one of several in a declared multi-parent "
        text: "**If this parent is one of several in a declared multi-parent unit** (spec's tasks.md unit grouping): the tooling commits the completion+summary docs on the branch, pushes, and **dispatches the required workflows against the unit branch**, printing the run URLs — **no PR yet**; the PR opens at UNIT completion. Completion docs declare where their run results were measured (Completion Documentation Guide § \"CI provenance — where a green was measured\")."
      - id: for-parent-tasks-set-8
