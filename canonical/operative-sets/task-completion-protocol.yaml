  "#key-rules":
    canonicalHash: sha256:80c2462bf7a9e6c1e7a3bd7edc6e36abb523168f644fe3c777eec59993d53977
    items:
      - id: key-rules-1
        kind: obligation
        label: "Implementation / Architecture tasks: the unit's required che"
        text: "**Implementation / Architecture tasks**: the unit's required checks enforce a green suite at merge — local validation before completion catches failures early."
      - id: key-rules-2
        kind: obligation
        label: "All parent tasks: create BOTH the completion doc AND the sum"
        text: "**All parent tasks**: create BOTH the completion doc AND the summary doc, on the task branch."
      - id: key-rules-3
        kind: obligation
        label: "All tasks: STOP after completion — never auto-proceed to the"
        text: "**All tasks**: STOP after completion — never auto-proceed to the next task. Authorization to START the next task is governed by Start Up Tasks; the merge that completes this task is not that authorization."
      - id: key-rules-4
        kind: obligation
        label: "Parent vs. subtask is the load-bearing distinction: subtasks"
        text: "**Parent vs. subtask** is the load-bearing distinction: subtasks get targeted tests + a completion doc + an **optional, judgment-based** branch commit-and-push (at a checkpoint, on backup-worthy accumulation, or at a session/handoff boundary — not mechanically per subtask); parents get full validation + completion doc + summary doc, committed on the branch."
      - id: key-rules-5
        kind: obligation
        label: "The merge unit is the coherent unit — the smallest chunk tha"
        text: "**The merge unit is the coherent unit** — the smallest chunk that is coherent-on-its-own AND reviewable as a single diff, DECLARED in the spec's tasks.md (a small spec = one unit = one PR; a large spec declares internal units). The unit's completion opens the PR; a parent inside a multi-parent unit is done-on-branch, accepted at the unit's merge."
      - id: key-rules-6
        kind: obligation
        label: "A task is accepted at the MERGE of its unit. Agents open PRs"
        text: "**A task is accepted at the MERGE of its unit.** Agents open PRs at unit completion; Peter merges on green. Never merge your own PR. Pushes to `main` are rejected by branch protection (admins included)."
      - id: key-rules-7
        kind: obligation
        label: "On merge, the unit's branch is cleaned up — remote auto-dele"
        text: "**On merge, the unit's branch is cleaned up** — remote auto-deleted by repo setting; local deleted on return to `main`; stale/unmerged branches swept in the monthly Civitas health check."
      - id: key-rules-8
        kind: obligation
        label: "A checks-only merge is NOT ratification: governance-law chan"
        text: "**A checks-only merge is NOT ratification**: governance-law changes still ratify via the record-first ballot protocol (`.kiro/docs/ballots/README.md`)."
      - id: key-rules-9
        kind: obligation
        label: "Delegated-tier capture (UNCONDITIONAL — amended by the 2026-"
        text: "**Delegated-tier capture (UNCONDITIONAL — amended by the 2026-09-19 delegated-tier-capture ballot; previously exception-based)**: every parent completion doc carries, in its header block, exactly one fixed-form line — `**Delegated-tier**: plan held`, or the divergence form `**Delegated-tier**: planned <agent> (<tier>) → actual <agent> (<tier>) — <one-line reason>; class: agent-evolution` (or `model-evolution`, or `both`). **Silence is no longer a recordable state**: exception-based capture made a missing note ambiguous between plan-held and unrecorded divergence. A recorded divergence is a cheap data-point, **not** a justification to defend (overriding a stale or rote stamp is the *correct* move) — it feeds model-tier recalibration and the claims passes, which verify presence and audit accuracy. Agent-evolution (routing/scope estimate was off) and model-evolution (cognitive-demand estimate was off) are distinct signals. Forms + grammar: Completion Documentation Guide § \"The delegated-tier line — unconditional\". See `process-orchestration-model-selection`."
    confirmation: canonical/profiles/consumer/confirmations/task-completion-protocol.md#key-rules
