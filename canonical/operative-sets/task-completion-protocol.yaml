        kind: obligation
        label: "In-repo rollback traverses a PR or the emergency path"
        text: "**In-repo rollback is not exempt**: rollback procedures illustrated in the release-tool consumer docs end in `git push origin main` — valid for consumer repos, rejected in this repo. An in-repo rollback traverses a PR or this emergency path."
