# canonical/operative-sets/task-completion-protocol.yaml — operative-set record (design C16; Req 11.6.5d)
#
# Every body unit of .kiro/steering/Task-Completion-Protocol.md, an always-set member (Spec 123 Task 15.4). Under path (B) (Req 12.1a) the
# shipped steering doc IS the canonical counterpart. Owner thurgood (a Civitas governance-layer doc) ==
# the profile author, so the C1 confirmer is the counterpart seat, Stacy. Drafted by Thurgood.
# canonicalHash = "sha256:" + hex SHA-256 over the unit's exact bytes (partition(splitFrontmatter(src).body)).
# Item text is the COMPLETE operative text, a verbatim substring of its unit; label is never matched.
source: .kiro/steering/Task-Completion-Protocol.md
owner: thurgood
confirmer: stacy
units:
  "#task-completion-protocol:preamble":
    canonicalHash: sha256:470b82059538dd17eeebcea849187caecfa75fc0afc0479ad294c921350e4baf
    items:
      - id: operational-law
        kind: obligation
        label: "TCP owns the end; Start Up Tasks owns the start"
        text: "**Operational law (always-loaded).** This is the authoritative end-of-task sequence. The pre-task checklist (date check, governance health, Jest command selection, authorization-to-START rules) lives in the always-loaded **Start Up Tasks**. This doc owns the **end** of a task; Start Up Tasks owns the **start**."
    confirmation: canonical/profiles/consumer/confirmations/task-completion-protocol.md#task-completion-protocol:preamble
  "#critical-do-not-mark-a-task-complete-before-its-required-steps":
    canonicalHash: sha256:ebe9ae3c776f236e195e92ffc5c5fd5f80cd00fd41083417e4fa6c49cc46500d
    items:
      - id: critical-do-not-mark-1
        kind: obligation
        label: "DO NOT mark a task complete before completing the required s"
        text: "**DO NOT mark a task complete before completing the required steps for that task type.** Task types are defined in `tasks.md` — check the `**Type**:` field (Setup / Implementation / Architecture / Documentation)."
      - id: completion-guide-query
        kind: command
        label: "Query the Completion Documentation Guide"
        text: "get_section({ path: \"completion-documentation-guide\", heading: \"Two-Document Workflow\" })\nget_section({ path: \"completion-documentation-guide\", heading: \"Documentation Tiers\" })"
    confirmation: canonical/profiles/consumer/confirmations/task-completion-protocol.md#critical-do-not-mark-a-task-complete-before-its-required-steps
  "#for-subtasks":
    canonicalHash: sha256:d3441b73b9ced68042b67726692b8f87d3ce9e086d7e68336292da8b69895d75
    items:
      - id: for-subtasks-1
        kind: obligation
        label: "[ ] Run targeted tests relevant to the change (not the full "
        text: "Run targeted tests relevant to the change (not the full suite)"
      - id: for-subtasks-2
        kind: obligation
        label: "[ ] Create completion doc: .kiro/specs/[spec]/completion/tas"
        text: "Create completion doc: `.kiro/specs/[spec]/completion/task-N-M-completion.md` — **enforced (S-4, ratified 2026-09-19)**: the claims passes count subtask-doc presence, and a ticked subtask without its doc is a **finding** on the authoring agent. The floor is three light elements (what changed · targeted tests + result · application-time adaptations, `none` written, never implied) — Completion Documentation Guide § \"The subtask completion doc\""
      - id: for-subtasks-3
        kind: obligation
        label: "[ ] Mark subtask complete (use the taskStatus tool)"
        text: "Mark subtask complete (use the `taskStatus` tool)"
      - id: for-subtasks-4
        kind: obligation
        label: "[ ] Commit is optional and judgment-based — not mechanical p"
        text: "**Commit is optional and judgment-based — not mechanical per subtask.** When you commit, **commit AND push the unit branch** (`task/<spec>-<unit-slug>` or `task/<spec>-<N>-<slug>`, created at the first subtask — `git switch -c` or the completion tooling's equivalent); the two stay coupled because the push is the off-machine backup guarantee (a local-only commit is not backed up). Commit-and-push at a **checkpoint** (delicate or potentially-breaking work — a restore point worth having), when **backup-worthy work has accumulated** (a unit branch is longer-lived than a single task, so more unpushed work sits at risk between merges — push before the pile grows), or at a **session/handoff boundary**. Do NOT commit mechanically after every trivial subtask — the unit squash-merges anyway, so subtask granularity is cosmetic to `main`'s history. No PR opens until unit completion, and subtasks do NOT open PRs. Make the checkpoint with the completion tooling (`complete-task.sh --subtask`): it commits, pushes, **dispatches the required workflows against the unit branch**, and prints the run URLs (`--no-ci` skips the dispatch for a checkpoint you know is red). Those runs are **feedback, not the gate**: they report under non-required context names and test the branch head, not the merge ref. The gate runs on the unit PR."
      - id: for-subtasks-5
        kind: obligation
        label: "[ ] STOP and wait for user authorization"
        text: "**STOP** and wait for user authorization"
    confirmation: canonical/profiles/consumer/confirmations/task-completion-protocol.md#for-subtasks
  "#for-parent-tasks-implementation-or-architecture-type":
    canonicalHash: sha256:e2958dd6f1a60a5f2b1054e109efe5e8ebd176f263302b87d096772c9243a1c5
    items:
      - id: for-parent-tasks-imp-1
        kind: obligation
        label: "[ ] Local validation: the unit PR's required checks run the "
        text: "Local validation: the unit PR's required checks run the full suite at the gate — validating locally first catches failures before they block the merge (test-command selection: Start Up Tasks)"
      - id: for-parent-tasks-imp-2
        kind: obligation
        label: "[ ] Mark parent task complete (use the taskStatus tool) — th"
        text: "Mark parent task complete (use the `taskStatus` tool) — the status change commits with the work and takes effect at merge; a failing suite blocks that merge at the gate"
      - id: for-parent-tasks-imp-3
        kind: obligation
        label: "[ ] Create completion doc: .kiro/specs/[spec]/completion/tas"
        text: "Create completion doc: `.kiro/specs/[spec]/completion/task-N-completion.md` (on the task branch) — reproduce every tasks.md success-criterion row verbatim with Status + Evidence, and carry the forced-negative line (Completion Documentation Guide § 'Parent Success-Criteria Fidelity'), and the `**Instruments**:` header line naming the parent's Instruments block (§ 'The instruments line and block')."
      - id: for-parent-tasks-imp-4
        kind: obligation
        label: "[ ] Create summary doc: docs/specs/[spec]/task-N-summary.md "
        text: "Create summary doc: `docs/specs/[spec]/task-N-summary.md` (on the task branch)"
      - id: for-parent-tasks-imp-5
        kind: obligation
        label: "[ ] Complete the parent on its unit branch: ./.kiro/hooks/co"
        text: "Complete the parent on its unit branch: `./.kiro/hooks/complete-task.sh \"...\"`."
      - id: for-parent-tasks-imp-6
        kind: obligation
        label: "If this parent IS its own merge unit (a standalone task, or "
        text: "**If this parent IS its own merge unit** (a standalone task, or a small single-unit spec): the tooling opens the PR and reports the URL."
      - id: for-parent-tasks-imp-7
        kind: obligation
        label: "If this parent is one of several in a declared multi-parent "
        text: "**If this parent is one of several in a declared multi-parent unit** (see the spec's tasks.md unit grouping): the tooling commits the completion+summary docs on the branch, pushes, and **dispatches the required workflows against the unit branch**, printing the run URLs — **no PR yet**. The PR opens when the UNIT completes (its final/gating parent). Completion docs declare where their run results were measured (Completion Documentation Guide § \"CI provenance — where a green was measured\")."
      - id: for-parent-tasks-imp-8
        kind: obligation
        label: "[ ] STOP — if a PR opened, report the PR URL; otherwise repo"
        text: "**STOP** — if a PR opened, report the PR URL; otherwise report the on-branch parent completion. **The task is accepted when Peter merges the UNIT's PR** (merge on green = the authorization act). Never merge your own PR."
    confirmation: canonical/profiles/consumer/confirmations/task-completion-protocol.md#for-parent-tasks-implementation-or-architecture-type
