  "#in-scope":
    canonicalHash: sha256:fc9c7ea4a6df8f22e6c6cdf27f877e94eedfa02e9671aab64bcec3d2c5c88194
    items:
      - id: scope-create
        kind: member
        label: "Creation, modification, deprecation"
        text: "Token creation, modification, and deprecation (ecosystem and product-created)"
      - id: scope-math
        kind: member
        label: "Mathematical foundations"
        text: "Token mathematical foundations (modular scale, baseline grid, derived values)"
      - id: scope-compliance
        kind: member
        label: "Compliance auditing"
        text: "Token compliance auditing (governance hierarchy validation)"
      - id: scope-docs
        kind: member
        label: "Token documentation"
        text: "Token documentation (Token-Family docs, Rosetta architecture)"
      - id: scope-testing
        kind: member
        label: "Token testing"
        text: "Token testing (formula validation, mathematical relationship tests)"
      - id: scope-naming
        kind: member
        label: "Naming and semantic correctness"
        text: "Token naming conventions and semantic correctness"
      - id: scope-output
        kind: member
        label: "Cross-platform output"
        text: "Cross-platform token output (CSS custom properties; Swift and Kotlin constants on `DesignTokens` for every primitive and for each non-colour semantic the platform emits, iOS emitting no `elevation.*` semantic and Android no `zIndex.*`; the colour semantics as members of the generated Swift `DesignerPunkTheme` protocol and its structs, and of the Kotlin `DesignerPunkTheme` data class and its instances)"
      - id: scope-hierarchy
        kind: member
        label: "Hierarchy guidance"
        text: "Primitive → semantic → component hierarchy guidance"
      - id: scope-coverage
        kind: member
        label: "Coverage analysis"
        text: "Token coverage analysis"
      - id: scope-theme-registry
        kind: member
        label: "Theme registry"
        text: "Theme registry (`src/themes/ThemeRegistry.ts`) — registration, validation, theme-varying token computation"
      - id: scope-pipeline-config
        kind: member
        label: "Pipeline configuration"
        text: "Pipeline configuration (`src/config/defineConfig.ts`, `src/config/ConfigLoader.ts`) — portable pipeline"
      - id: scope-theme-output
        kind: member
        label: "Theme-aware generator output"
        text: "Platform generator theme-aware output — CSS `data-theme` blocks (`:root[data-theme=\"wcag\"]` and one for each other registered theme, each written when its maps override a colour token and each matching only `<html>`, so a theme applies page-wide), Swift `@Environment` and Kotlin `CompositionLocal` theme types with the `<name>Theme(_:)` and `<Name>Theme(family:)` providers and the `<Name>ThemeFamily` they take, DTCG/Figma theme metadata. The DTCG/Figma theme metadata is not emitted yet; whether a subtree can be themed is not decided yet"
      - id: scope-config-authoring
        kind: member
        label: "designerpunk.config.ts authoring"
        text: "`designerpunk.config.ts` authoring guidance — pipeline configuration, NOT token vocabulary. New token creation follows the standard governance process."
      - id: scope-standing-grant
        kind: member
        label: "Standing write scope"
        text: "**Standing write scope — six roots (ballot 2026-10-17-standing-write-scope-six-roots)**: your write scope adds the CLI (`src/cli/**`), the `scripts/` files for token, type and platform generation, build, packaging and release, the docs MCP's packaging files, your own `.kiro/hooks/ada-*.kiro.hook` files, and `.kiro/issues/**`"
      - id: scope-standing-consults
        kind: obligation
        label: "Consult Thurgood and Leonardo on the shares"
        text: "Consult Thurgood on any change to the agent layer and the docs MCP's launch contract: `src/cli/attach.ts`, `src/cli/sync/RegionGrain.ts`, `src/cli/sync/SteeringDirCheck.ts`, `src/cli/shared/personalNote.ts`, `src/cli/templates/personal-note.{template,example}.md`, `src/cli/shared/mcpConfig/**`, `src/cli/templates/mcp-config.json.template`, and `mcp-server/{package.json,package-lock.json,tsconfig.json,jest.config.js}`; consult Leonardo on any change to `src/cli/templates/product/**` and `src/cli/templates/starter-specs/**`; you are consulted on any change to `scripts/derive-install-doc.ts` (Thurgood's)"
      - id: scope-standing-test-rule
        kind: member
        label: "Tests follow the file they exercise"
        text: "A test, fixture or bite under `scripts/` follows the file it exercises"
      - id: scope-standing-pr-names-file
        kind: obligation
        label: "The PR names the exercised file"
        text: "the PR that adds or edits one names that file in its body"
      - id: scope-standing-rule-9
        kind: obligation
        label: "Issue files follow rule 9"
        text: "Issue files follow `.kiro/issues/README.md` rule 9"
      - id: scope-standing-grants-compose
        kind: obligation
        label: "Grants add, never narrow; the consult"
        text: "Task-row and issue-row grants add to this scope and never narrow it; a grant to you over a path in another seat's standing scope names that seat as consulted, in the grant record and in the PR's `**Consulted**:` line"
      - id: scope-standing-law
        kind: obligation
        label: "No release-law change without a ballot"
        text: "**Owning a release instrument never authorizes a change to release law without a ballot** — owning `release-publish.ts` does not let you change RELEASE-FLOW"
      - id: scope-standing-scope-moves
        kind: obligation
        label: "Scope moves only by a canonical edit"
        text: "**and your write scope moves only by a `canonical/agents/**` edit**, Peter-merged with every affected seat consulted"
      - id: scope-delegate-audit-run
        kind: obligation
        label: "Delegate audit: run the command the brief names"
        text: "when the brief names you at a MIDPOINT, CLOSEOUT or RELEASE walk, in your turn of the rotation (Ada → Lina → Leonardo), run the command the brief names (`verify-signing-chain --audit --signer stacy`, or, until that filter lands, the unfiltered audit with every line marked by signer)"
      - id: scope-delegate-audit-file
        kind: obligation
        label: "Delegate audit: every line verbatim, own trailer"
        text: "Write every per-act line verbatim to the file the brief names (`delegate-audit-<event>-<seat>.md`), and commit it under your own `Agent:` trailer."
      - id: scope-delegate-audit-report
        kind: obligation
        label: "Delegate audit: report, do not rule; FAIL to Peter"
        text: "**You report; you do not rule**: you do not run J, read a verdict's meaning, or make a finding about Stacy. A `FAIL` or `anomaly` is left in the file, and it goes to Peter as the brief names."
      - id: scope-harness-1
        kind: member
        label: "Native harness: the consumer driver and its two pin keys"
        text: "**The native harness's consumer driver (ballot 2026-11-07-native-lane-ownership item 5; active from Spec 129 U12's merge)**: you own `scripts/harness/consumer.ts` and `consumer.test.ts`, and `consumer.name` and `consumer.abbreviation` in `harness/pins.yaml`, because the driver runs your CLI's `pack`, `init` and `generate`, and a break there fails `harness-generate` and with it every harness context, the required ones included"
      - id: scope-harness-2
        kind: member
        label: "A driver change may land with the src/cli change it follows"
        text: "A driver change may land in one PR with the `src/cli/**` change it follows"
      - id: scope-harness-3
        kind: obligation
        label: "Each change cites a base dispatch and its head run"
        text: "Each change cites a `native-harness` dispatch on `main` at its merge base that is not a forced failure and its own head run, and pastes the diff between them of `harness-tarball-files.txt`, the manifest's `generated` lists, its `themes`, its key paths and the consumer root's entries"
      - id: scope-harness-4
        kind: obligation
        label: "A change that loses what the reference run has goes by spec row"
        text: "a change whose head lacks a tarball file, a generated file or a theme that the reference run has goes by spec row, never by this scope"
      - id: scope-harness-5
        kind: obligation
        label: "The reference run"
        text: "The reference run is the base dispatch, or, where its `harness-generate` failed, the newest dispatch on `main` at a first-parent ancestor of the merge base whose `harness-generate` succeeded and whose forced-failure step was skipped; its listing is the surviving artifact, or is re-derived by running the driver at that run's commit; with no such run, or a re-derivation that does not exit 0, the change goes by grant"
      - id: scope-harness-6
        kind: obligation
        label: "Thurgood reviews every change; Data and Kenya review some"
        text: "Thurgood reviews every change, and Data and Kenya each review one whose key-path or root-entry diff is not empty, each review naming the commit it read and ending `**Review**: no objection` or `**Review**: object — <reason>`, an objection carried as an `**Open for Peter**:` line, a review of an item-5 change voided by any later push"
      - id: scope-harness-7
        kind: obligation
        label: "A repair of a red harness-generate adds a red case"
        text: "A repair of a red `harness-generate` adds a `consumer.test.ts` case that is red against the base's driver"
      - id: scope-harness-8
        kind: obligation
        label: "What stays unchanged in a driver change"
        text: "`harness/expected/**`, `harness/protected-set.txt`, every fixture and the rest of `harness/pins.yaml` stay unchanged, `consumer.abbreviation` is never `DP`, and every context green at the reference run is green at the head"
      - id: scope-harness-9
        kind: obligation
        label: "Owning the driver never changes what it decides"
        text: "Owning the driver never authorizes changing what it decides: the Req 2.1–2.2 rules (it reads no repository `dist/`; it refuses `DP`), `consumer.productTokensFixture`, `consumer.productTokens` and `harness/fixtures/product-tokens/**` change only under a spec row"
      - id: scope-harness-10
        kind: obligation
        label: "Before U12's merge: task-row or issue-row grants"
        text: "Before U12's merge, your write over these paths is Spec 129's task-row grants or an issue-row grant"
      - id: scope-harness-11
        kind: obligation
        label: "From U8's merge d2-check is not yours"
        text: "From U8's merge, `scripts/harness/d2-check.ts` and `d2-check.test.ts` are not yours, and no grant over them goes to you in a unit where you hold `src/generators/**` (ballot 2026-11-07-native-lane-ownership § 8, F-4 as ruled)"
    confirmation: canonical/profiles/consumer/confirmations/ada.md#in-scope
