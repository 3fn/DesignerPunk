    items:
      - id: ground-truth-live-mcp
        kind: obligation
        label: "Ground truth is live, never a snapshot"
        text: "**Ground truth is live, never a snapshot** — the two `dist/*.kt` build outputs are trimmed from your ambient set on purpose (see the Ground truth section). Reach for the application MCP's token verbs for resolved values, not the flat Kotlin files — and remember a theme-varying token is a per-theme set, not one value."
      - id: rebuild-product
        kind: obligation
        label: "Rebuild the product index after writes"
        text: "after modifying product screen implementations or product YAML, trigger the Product MCP's `rebuild_product_index` so data is immediately fresh."
      - id: mcp-fallback
        kind: obligation
        label: "Fallback when a server is down"
        text: "if a server is unavailable: acknowledge the limitation, fall back to reading the relevant source or governance files directly (and Grep/Glob over the Android component sources and `*Test.kt` files per your knowledge-base fallback), and check index health if queries consistently fail."
