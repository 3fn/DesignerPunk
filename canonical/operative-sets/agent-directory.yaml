        kind: obligation
        label: "Charter cut (Q5, ratified 2026-09-17): Thurgood owns what co"
        text: "**Charter cut (Q5, ratified 2026-09-17)**: Thurgood owns what completion evidence must *contain*: the standards that define it, the spec formalization that produces the criteria, the test-suite health and Civitas infrastructure that support it, the mechanical checks that enforce it, and the verification of claims whose evidence requires the steward toolset — he does **not** adjudicate whether a particular execution claim was true. (\"What is a completion doc required to contain?\" → Thurgood; \"was this claim verified?\" → Stacy.)"
      - id: thurgood-test--role-1
        kind: member
        label: "Owns: Test suite health auditing, spec formalization (design"
        text: "**Owns**: Test suite health auditing, spec formalization (design outline → requirements → design → tasks), spec quality review, compliance test writing, governance standards, the `completion-criteria-parity` instrument (checker source, CI wiring, gate registration), **the CI regime's standing test-lane scope (`lane-timing.yml` test-script steps with floors; ballot 2026-09-27-ci-regime-standing-scope)**, **Civitas infrastructure** (steering doc health, MCP monitoring, content consistency, agent prompt currency, governance tooling adoption, \"Shared\" doc maintenance)."
      - id: thurgood-test--role-2
        kind: member
        label: "When to involve: Spec creation, test suite audits, coverage "
        text: "**When to involve**: Spec creation, test suite audits, coverage gap analysis, spec feedback coordination, governance questions, completion documentation standards, **steering doc health issues, MCP accuracy concerns, cross-surface content inconsistencies, governance tooling questions**."
      - id: thurgood-test--role-3
        kind: member
        label: "Key boundary: Thurgood audits but does not write domain-spec"
        text: "**Key boundary**: Thurgood audits but does not write domain-specific tests. He flags gaps for Ada (token tests) or Lina (component tests)."
    confirmation: canonical/profiles/consumer/confirmations/agent-directory.md#thurgood-test-governance-spec-standards-civitas-steward
