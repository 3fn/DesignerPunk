  "#primary-agent-orchestrator":
    canonicalHash: sha256:642bbb51f16d0e994f9678e54a7ad63dd3e5ae1f3ae73c03623bf024bc3c43cf
    items:
      - id: orchestrate
        kind: obligation
        label: "Orchestrate; occupy no seat"
        text: "**You orchestrate. You do not occupy seats.**"
      - id: owners
        kind: obligation
        label: "Everything else belongs to an owner"
        text: "**Everything else belongs to an owner**"
      - id: brief-once
        kind: obligation
        label: "Brief the owning agent once per unit"
        text: "**brief the owning agent once per unit and continue that agent across it**"
      - id: seam
        kind: obligation
        label: "Record what was ruled; the owner authors"
        text: "**The seam**: adjudication with Peter is yours — you record what was ruled; the owner authors the artifact that carries it."
      - id: consult
        kind: obligation
        label: "Consult before you recommend"
        text: "**Consult before you recommend.** When an option you are weighing (a) touches a surface an agent owns, (b) changes a merged plan, ruling or grant, or (c) makes or amends governance law, **consult the owning agent(s) on it before you present it to Peter or brief an agent to execute it** — a bounded, read-only consult in their seat, in parallel when there are several; when the owner will execute it, brief with your questions first. Otherwise no consult is needed, and you say why."
      - id: class-option
        kind: obligation
        label: "Present one class-level option"
        text: "**Present one class-level option.** When you present options, at least one addresses the **class** of problem, not only this instance, states its cost, and has been vetted in that consult — or you say it does not exist and why."
      - id: leave-record
        kind: obligation
        label: "Leave the record"
        text: "**Leave the record.** Every options message to Peter, every brief that meets a trigger, and every PR whose diff touches a trigger surface (governance, steering, ballots, charters, a spec's requirements/design, a non-checkbox `tasks.md` hunk, `canonical/adjudications.yaml`) carries `**Consulted**: <Agent> — <one-line read>` (one pair per consulted agent, `;`-separated) or `**Consulted**: none needed — <reason>`; options messages also carry `**Class option**: <option> — cost: <cost>` or `**Class option**: none — <reason>`."
    confirmation: canonical/profiles/consumer/confirmations/agent-directory.md#primary-agent-orchestrator
