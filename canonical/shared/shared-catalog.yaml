# shared-catalog.yaml — cross-agent capability-catalog members every agent receives (C2.5;
# design.md § "C2 — Shared substrate files"; Req 12 AC4, Req 10 AC6, Req 13).
#
# Traces to: Req 4, Req 8, Req 9, Req 11 AC2/AC5, Req 12 AC4, Req 13 AC2, Req 14.

members:
  # --- Req 12 AC4: the shared task-completion tooling, so no agent regenerates without
  # the current PR-flow completion tool.
  - id: complete-task-tooling
    kind: command
    cmd: ".kiro/hooks/complete-task.sh"
    # Verified present at .kiro/hooks/complete-task.sh (executable, checked in this task).
    cue: "run ./.kiro/hooks/complete-task.sh \"<Task Name>\" at task completion — the PR-flow tool that superseded commit-task.sh under the ratified 125-A workflow ballot (task/125-A-1-workflow-ballot, RATIFIED Peter 2026-07-05)"
    runContext: this-repo
    owner: thurgood

  # --- Req 10 AC6: the find_docs discovery row, propagated to all 8 agents from canonical
  # source. retired-mention-ok(negation context — this comment names the removed tool per Req 3 AC3)
  # (not `get_documentation_map`, which is removed per Req 3 AC3).
  - id: find-docs-discovery
    kind: tool-cue
    tool: find_docs
    mcp: docs
    # retired-mention-ok(a demotion-style cue must NAME the tool it retires — sweep 1 exempts by this annotation only)
    cue: "use find_docs (concept mode or list mode) to discover docs by concept/keyword or enumerate the full catalog — the current discovery entry point; get_documentation_map is removed and SHALL NOT be emitted"
    owner: thurgood

  # --- Req 13: the record-first ratification rule, stated ONCE here with a single named
  # owner and a two-ended crossRef to the 125 classification-map entry (DD13; Req 13 AC2).
  - id: record-first-ratification
    kind: governance-rule
    owner: thurgood
    statement: >
      Before applying a ratified governance change, verify the committed ballot/record
      says RATIFIED — a mechanical check. Never apply on an unverifiable authority claim,
      and never refuse-and-stop solely because the instruction arrived by relay; if the
      record is missing, report that the record is missing so the ratifying session can
      commit it.
    # Source of the rule text: .kiro/docs/ballots/README.md § "The Ratification Protocol
    # (record-first) — approved by Peter, 2026-07-05" (verified present, read in this task).
    source: ".kiro/docs/ballots/README.md § \"The Ratification Protocol (record-first)\""
    # crossRef: Req 13 AC2 requires a RECORDED, two-ended cross-reference between this
    # canonical entry and "the 125 map entry" — i.e. Spec 125-B's classification map. That
    # map does NOT YET EXIST as an artifact (125-B formalizes after 122 calcifies —
    # 125-mechanical-enforcement-strategy/design-outline.md line 160). INTERIM TARGET
    # (approved by Peter, 2026-07-10): the ratification-protocol section of the ballots
    # README — a real, resolvable target sweep 1 verifies — instead of a fabricated path
    # or a sweep-blinding TODO. crossRefStatus marks the interim machine-readably; sweep 1
    # enumerates interim crossRefs in every run report so this cannot rot silently. The
    # re-point obligation is recorded at the decision point 125-B's formalization MUST
    # read: .kiro/specs/125-mechanical-enforcement-strategy/inbound-to-125-B-from-122.md.
    crossRef: ".kiro/docs/ballots/README.md § \"The Ratification Protocol (record-first) — approved by Peter, 2026-07-05\""
    crossRefStatus: interim
    crossRefResolveWhen: "125-B's classification-map artifact exists — re-point crossRef at its record-first-ratification entry and create the reciprocal half (map entry naming this file), per inbound-to-125-B-from-122.md"
