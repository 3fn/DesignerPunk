  - canonical: skills/adaptive
    targets:
      cc: .claude/skills/adaptive
      kiro: .kiro/skills/android/adaptive
    owners: [data]
  - canonical: skills/edge-to-edge
    targets:
      cc: .claude/skills/edge-to-edge
      kiro: .kiro/skills/android/edge-to-edge
    owners: [data]
  - canonical: skills/navigation-3
