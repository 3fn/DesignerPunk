# skills-map.yaml — the explicit canonical-keyed skill mapping table (C2.2;
# design.md § "C2 — Shared substrate files"; Req 8 AC1/AC2).
#
# POPULATED (Task 3.1). The 5 canonical skills have been relocated under the neutral
# top-level `skills/` root (`git mv` from `.kiro/skills/**`), and this table now carries one
# canonical-keyed row per skill. `.kiro/skills/android/SKILL.md` (an index/umbrella, not a
# skill — referenced by zero agent configs) was deleted rather than migrated; the table below
# supersedes it as the authoritative index. `.claude/skills/**` is untouched by this task —
# Task 3.2 emits both `.claude/skills/**` and `.kiro/skills/**` FROM this table.
#
# Round-trip check (sweep 2, Req 19): every directory under `skills/` has exactly one row
# below, and every row below has a corresponding directory under `skills/`. This is now 5 ↔ 5.
#
# Row shape (per design.md §C2.2, reproduced verbatim as the authoring template — do not
# add rows without this exact shape):
#
#   - canonical: skills/theming-styles          # the neutral-root home; SKILL.md + bundled scripts inside
#     targets:
#       cc:   .claude/skills/theming-styles     # flat dir + SKILL.md + activation description intact
#       kiro: .kiro/skills/android/theming/styles
#     owners: [data]
#
# `.kiro/skills/**` is a GENERATED OUTPUT of this table, same as `.claude/skills/**` — Kiro
# is not the source. Agents reference skills by row `canonical:` key only (C1 `skills:`),
# never by path; adapters resolve key -> per-target path + per-target reference syntax
# (`skill://<kiro path>` vs the CC Skill-tool naming).
#
# Traces to: Req 4, Req 8, Req 9, Req 11 AC2/AC5, Req 12 AC4, Req 13 AC2, Req 14.

