      cc: .claude/skills/navigation-3
      kiro: .kiro/skills/android/navigation-3
    owners: [data]
  - canonical: skills/theming-styles
    targets:
      cc: .claude/skills/theming-styles
      kiro: .kiro/skills/android/theming/styles
    owners: [data]
  - canonical: skills/impeccable
    targets:
      cc: .claude/skills/impeccable
      kiro: .kiro/skills/impeccable
    owners: [leonardo]
  # The Spec 122 C10.3 standing-fixture row — an inert skill whose only purpose is to give
