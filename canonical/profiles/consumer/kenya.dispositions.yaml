  "#in-scope": {"disposition": "re-pointed", "removals": [{"text": "(referencing existing platforms/ios/ implementations)", "cites": "subtraction-5"}, {"text": "- **The native compile harness's iOS lane (ballot 2026-11-07-native-lane-ownership items 2 and 3; active from the later of Spec 129 U12's merge and the first iOS promotion's merge)**: you own `harness/ios/**`, `scripts/harness/probe-swift.ts` and `scripts/harness/parse-swift.ts`, with `probe-swift.test.ts`, `parse-swift.test.ts`, `fixtures/swift/**` and `fixtures/parse-swift/**`, because a promoted iOS context is a required check and a break from outside the repository (the runner image retiring or rebuilding the pinned Xcode) lands on it with no PR author at fault. Owning the lane never authorizes changing what it decides: the verdict rules, the toolchain, self-test and Xcode-pin rules (K-4, K-6, K-7), the infra and run rules, and the parser contract follow their spec text first, and a change that makes `harness/ios/selftest/**` catch less is a change to K-4; a fix where the code disagrees with that text is yours, with a falsification case red at the merge base that the PR body names. A change to an annotation step or title, including a first `harness-infra` on iOS, consults Thurgood. In `harness/pins.yaml` you hold the `ios:` section only, and only for a move that passes that ballot's P1–P7: the red it repairs, on a dispatch at the merge base, is a `toolchain` verdict or `toolchain missing`; only `image` and `toolchain` change, with the toolchain keys unchanged and `image.version` set to the head run's runner image version, each moved field to the value the red run observed or, for a missing Xcode, to K-7's pick from the runner-images readme at a cited commit and the head run's printed toolchain; `harness/expected/**`, `harness/protected-set.txt`, `harness/ios/selftest/**` and every fixture are unchanged; every iOS context is green at the PR head, with both runs' verdict lines pasted; Thurgood's review is cited on the `**Consulted**:` line, naming the commit it read and ending `**Review**: no objection` or `**Review**: object — <reason>`, an objection carried as an `**Open for Peter**:` line; and a new Swift version, on any PR, carries the reserved-word re-check or a record of it. Any other move goes by grant or spec row. Not yours: `harness/expected/**`, `harness/protected-set.txt`, `harness/fixtures/**`, `harness/README.md` (Thurgood's; you review its hunks in your sections), the rest of `harness/pins.yaml`, `compare.ts` (Thurgood's; you review its changes outside Kotlin-named declarations), `consumer.ts` (Ada's; you review its manifest and layout changes), `stability.ts` and `native-rules.ts` (Thurgood's; you review `native-rules.ts` changes outside Kotlin-named declarations), and `native-harness.yml` with `native-harness-workflow.test.ts` (an issue-row grant per fix). Before activation, your write over these paths is Spec 129's task-row grants or an issue-row grant.", "cites": "subtraction-1"}], "destination": "#in-scope", "signature": {"signer": "kenya", "canonicalHash": "sha256:43836080021834c69157a5c96f97c19f5b81f471bf18a8ad5ef0546f43baf308", "renderedHash": "sha256:95acdf37fac931240c7d10d515fd0bcd90f137ce3c1b34a4ed3cd6cd013cd81a", "assent": {"surviving": ["scope-1", "scope-2", "scope-3", "scope-4", "scope-5", "scope-6", "scope-7", "scope-8"]}, "evidence": "canonical/profiles/consumer/signatures/kenya.md#in-scope"}}
