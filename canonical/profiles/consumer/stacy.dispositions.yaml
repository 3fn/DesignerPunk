  "#operational-mode-claims-audit-execution-claims-verification-the-q5-cut:preamble": {"disposition": "re-pointed", "removals": [{"text": "**Authority**: the 2026-09-17 outline-settle ballot (RATIFIED, Peter — §§ 5, 11, 16), executing Peter's 2026-09-13 F7 full-package ruling; the co-signed joint working agreement + lifecycle amendment (`.kiro/specs/127-completion-claims-integrity/pre-spec/`, PRs #158/#165) are the underlying authority where this text and they disagree. Applied to this charter by Spec 127 U3.", "cites": "subtraction-2"}], "destination": "#operational-mode-claims-audit-execution-claims-verification-the-q5-cut:preamble"}
  "#the-charter-cut-ratified-verbatim": {"disposition": "re-pointed", "removals": [{"text": "you already own claims-vs-reality auditing one level up (`audit:coverage-map`, `verify-gate-registration.sh`) — Q5 extends", "cites": "subtraction-3"}], "destination": "#the-charter-cut-ratified-verbatim"}
  "#the-trigger-set-the-114-superset-table-names-never-numbers": {"disposition": "re-pointed", "removals": [{"text": "| **ARMING** | A new barrier arms / the required-check set changes / a CI-regime standing-scope (P1) PR merges or an issue-row grant (ballot 2026-09-27-ci-regime-standing-scope § 3) over a `.github/**` path merges (at its activating merge, and again when its fixing PR merges) | `audit:coverage-map` + `verify-gate-registration.sh`; **plus `completion-criteria-parity` dormancy** (C4-1) — you detect dormancy on the row Thurgood owns; he repairs; plus, for a P1 PR, the extent and additivity checks (ballot 2026-09-27-ci-regime-standing-scope § 2): the diff is exactly `lane-timing.yml`, `git diff --numstat` deletions `0`, the added step runs an existing `package.json` test script inside an existing required job, its floor fails on zero and selects with the step's own script or config, and `audit:coverage-map`'s lanes row for that root has cleared; for a `.github/**` issue-row grant, at activation the list names no governance-law path and names any M1-excluded act it admits, and at the fixing PR's merge its paths are a subset of the list as it stood at the activating merge (`git show <activating-merge>:<issue path>`), with `--numstat` deletions `0` on CI paths unless the grant names the act. RELEASE is the backstop, over the release delta | Stacy |", "cites": "subtraction-3"}, {"text": "| **GATE** | Every PR carrying a parent completion doc | `completion-criteria-parity` fires mechanically — **exhaustive, no judgment** | **Instrument** (Thurgood maintains) |", "cites": "subtraction-3"}, {"text": "| **STRAGGLER** | Ballot ratification of a law that claims bind | **Edit-site straggler sweep — did every enumerated site get applied** | Thurgood (corpus-state) |", "cites": "subtraction-2"}, {"text": "| ~~**BURST**~~ | ~~First session after a gap; N ≥ 3 parents merged since last audit~~ | ~~Cheap sampling pass; report M3/M4/M5~~ — **RETIRED**, superseded by CLOSEOUT + MIDPOINT; its counter-argument is preserved: BURST was the only trigger firing on *nothing having happened* | ~~Stacy~~ |", "cites": "subtraction-3"}], "destination": "#the-trigger-set-the-114-superset-table-names-never-numbers"}
  "#the-claims-pass-record-claims-passmd-the-template": {"disposition": "re-pointed", "removals": [{"text": "the owed-set predicate keys on", "cites": "subtraction-4"}, {"text": "classified per the 112 taxonomy", "cites": "subtraction-4"}, {"text": "the doc-vs-doc audit my own N6 called", "cites": "subtraction-2"}, {"text": "**fixed-string exemption usage**; **`(platforms: …)` fallback invocations**; **delegated-tier capture**; **orchestrator consult line**; **re-grounding dispositions**; **populations**; **M3 / M4 / M5**", "cites": "subtraction-3"}, {"text": "**The emission-reading duty**; **The delegated-tier read**; **The instruments read**", "cites": "subtraction-3"}, {"text": "<!-- volatile-ok: … -->", "cites": "subtraction-1"}], "destination": "#the-claims-pass-record-claims-passmd-the-template"}
