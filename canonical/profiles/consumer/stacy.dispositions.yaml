  "#the-trigger-set-the-114-superset-table-names-never-numbers": {"disposition": "re-pointed", "removals": [{"text": "| **ARMING** | A new barrier arms / the required-check set changes / a CI-regime standing-scope (P1) PR merges or an issue-row grant (ballot 2026-09-27-ci-regime-standing-scope § 3) over a `.github/**` path merges (at its activating merge, and again when its fixing PR merges) | `audit:coverage-map` + `verify-gate-registration.sh`; **plus `completion-criteria-parity` dormancy** (C4-1) — you detect dormancy on the row Thurgood owns; he repairs; plus, for a P1 PR, the extent and additivity checks (ballot 2026-09-27-ci-regime-standing-scope § 2): the diff is exactly `lane-timing.yml`, `git diff --numstat` deletions `0`, the added step runs an existing `package.json` test script inside an existing required job, its floor fails on zero and selects with the step's own script or config, and `audit:coverage-map`'s lanes row for that root has cleared; for a `.github/**` issue-row grant, at activation the list names no governance-law path and names any M1-excluded act it admits, and at the fixing PR's merge its paths are a subset of the list as it stood at the activating merge (`git show <activating-merge>:<issue path>`), with `--numstat` deletions `0` on CI paths unless the grant names the act. RELEASE is the backstop, over the release delta | Stacy |", "cites": "subtraction-3"}, {"text": "| **GATE** | Every PR carrying a parent completion doc | `completion-criteria-parity` fires mechanically — **exhaustive, no judgment** | **Instrument** (Thurgood maintains) |", "cites": "subtraction-3"}, {"text": "| **STRAGGLER** | Ballot ratification of a law that claims bind | **Edit-site straggler sweep — did every enumerated site get applied** | Thurgood (corpus-state) |", "cites": "subtraction-2"}, {"text": "| ~~**BURST**~~ | ~~First session after a gap; N ≥ 3 parents merged since last audit~~ | ~~Cheap sampling pass; report M3/M4/M5~~ — **RETIRED**, superseded by CLOSEOUT + MIDPOINT; its counter-argument is preserved: BURST was the only trigger firing on *nothing having happened* | ~~Stacy~~ |", "cites": "subtraction-3"}], "destination": "#the-trigger-set-the-114-superset-table-names-never-numbers", "signature": {"signer": "stacy", "canonicalHash": "sha256:5055f134c5a6c6fc5ecd2f499d3eb428ff14a0679946152f88e630c0c8de3d7a", "renderedHash": "sha256:9125e2b3608732006279ff89016052966e29a4b5a28369c25aba788f78e472fe", "refuse": "should-re-point", "evidence": "canonical/profiles/consumer/signatures/stacy.md#the-trigger-set-the-114-superset-table-names-never-numbers"}}
