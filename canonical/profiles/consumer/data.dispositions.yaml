  "#in-scope": {"disposition": "re-pointed", "removals": [{"text": "(referencing existing platforms/android/ implementations)", "cites": "subtraction-5"}, {"text": "- **The native compile harness's Android lane (ballot 2026-11-07-native-lane-ownership items 1 and 3; active from Spec 129 U12's merge)**: you own `harness/android/**`, `scripts/harness/probe-kotlin.ts` and `scripts/harness/parse-kotlin.ts`, with `probe-kotlin.test.ts`, `parse-kotlin.test.ts`, `fixtures/kotlin/**` and `fixtures/parse-kotlin/**`, because `harness-android-tokens` is a required check and a break from outside the repository (a runner image's JDK, a registry host or failure text, a Gradle resolve change) lands on it with no PR author at fault. Owning the lane never authorizes changing what it decides: the verdict rules, the infra and run rules, and the parser contract follow their spec text first; a fix where the code disagrees with that text is yours, with a falsification case red at the merge base that the PR body names. On every PR touching `harness/android/**`, `gradle/libs.versions.toml`'s `compile-sdk`, `min-sdk`, `coil` and `material-icons-extended` equal `harness/pins.yaml`'s `android.compileSdk`, `minSdk` and `libraries` at the head (that ballot's query). A change to `infra.json`'s fields or values, an annotation step or title consults Thurgood. In `harness/pins.yaml` you hold the `android:` section only, and only for a move that passes that ballot's P1–P6: the red it repairs, on a dispatch at the merge base, is environment-only; only `imageVersion` and `toolchain` change, the toolchain keys stay the same, each moved toolchain field takes the value the red run observed, and `imageVersion` takes the head run's runner image version; `harness/expected/**`, `harness/protected-set.txt` and every fixture are unchanged; every Android context is green at the PR head, with both runs' verdict lines pasted; and Thurgood's review is cited on the `**Consulted**:` line, naming the commit it read and ending `**Review**: no objection` or `**Review**: object — <reason>`, an objection carried as an `**Open for Peter**:` line. Any other move goes by grant or spec row. Not yours: `harness/expected/**`, `harness/protected-set.txt`, `harness/fixtures/**`, `harness/README.md` (Thurgood's; you review its hunks in your sections), the rest of `harness/pins.yaml`, `compare.ts` (Thurgood's; you review its changes outside Swift-named declarations), `consumer.ts` (Ada's; you review its manifest and layout changes), `stability.ts` and `native-rules.ts` (Thurgood's; you review `native-rules.ts` changes outside Swift-named declarations), `d2-check.ts`, and `native-harness.yml` with `native-harness-workflow.test.ts` (an issue-row grant per fix). Before U12's merge, your write over these paths is Spec 129's task-row grants or an issue-row grant.", "cites": "subtraction-1"}], "destination": "#in-scope", "signature": {"signer": "data", "canonicalHash": "sha256:fa54f8cf858c8d1c441c911b7c59cbcff4064990a50cb11ae99e5ae9c6f4fd23", "renderedHash": "sha256:28af0768f9f6a237affb171d37fc750f1b7ae37ef6c75c729854b37dca41555e", "assent": {"surviving": ["scope-1", "scope-2", "scope-3", "scope-4", "scope-5", "scope-6", "scope-7", "scope-8"]}, "evidence": "canonical/profiles/consumer/signatures/data.md#in-scope"}}
