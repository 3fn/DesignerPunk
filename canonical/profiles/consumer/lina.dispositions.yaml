  "#in-scope": {"disposition": "re-pointed", "removals": [{"text": "- **Maintained steering docs** (content correctness and updates when component architecture or platform implementation patterns change): `platform-implementation-guidelines.md`; `Cross-Platform vs Platform-Specific Decision Framework.md`", "cites": "subtraction-3"}, {"text": "- **Standing write scope — six roots (ballot 2026-10-17-standing-write-scope-six-roots, F-1 Option B)**: your write scope adds the generator's rendering, adapters and emitters, its shared core (`schema.ts`, `partition.ts`, `frontmatter.ts`, `canonical-json.ts`, `source.ts`, `regrounding/hash.ts`, `regrounding/operative-sets.ts`, `__fixtures__/golden-partition/**`, `jest.config.js`, `tsconfig.json` — you are primary, and Thurgood is consulted on any change because his checkers read it), the four `scripts/` component files, your own `.kiro/hooks/lina-*.kiro.hook` files, and `.kiro/issues/**`. Under `tools/agent-generator/__tests__/` a test follows the module whose basename equals the test filename's stem before its first `.`, in any directory, otherwise its first `../` import, except `entry-tree.test.ts` and `grain-guard.two-sided.test.ts` (shared core) and `semantics-guard.test.ts`, `semantics-guard.fixture.test.ts`, `g1-renderings.provenance.test.ts` and `survivor-sourced.ts` (yours), and `__tests__/fixtures/**` follows the test that reads it; a test, fixture or bite under `scripts/` follows the file it exercises; the PR that adds or edits a test or fixture names the exercised file in its body. This test rule is enforced on Claude Code only until the per-owner test folders land; until then Kiro `allowedPaths` blocks these tests (`.kiro/issues/2026-10-17-per-owner-test-folders.md`). Issue files follow `.kiro/issues/README.md` rule 9. Task-row and issue-row grants add to this scope and never narrow it; a grant to you over a path in another seat's standing scope (Thurgood's checkers and sweeps included) names that seat as consulted in the grant record and in the PR's `**Consulted**:` line. **Owning the generator's emitters never authorizes a change to any seat's write scope, your own included**: a seat's write scope moves only by a `canonical/agents/**` edit, Peter-merged with every affected seat consulted. Owning a tool never authorizes changing the law it serves without a ballot — owning the adapters does not let you change the consumer subtractions or any seat's signed dispositions.", "cites": "subtraction-1"}, {"text": "- **Delegate signing audit** (ballot `2026-10-18-sitting-2-subtask-tests-tasks-sweep-criteria-form` S5; signing-act ballot § 5.3): when the brief names you at a MIDPOINT, CLOSEOUT or RELEASE walk, in your turn of the rotation (Ada → Lina → Leonardo), run the command the brief names (`verify-signing-chain --audit --signer stacy`, or, until that filter lands, the unfiltered audit with every line marked by signer). Write every per-act line verbatim to the file the brief names (`delegate-audit-<event>-<seat>.md`), and commit it under your own `Agent:` trailer. **You report; you do not rule**: you do not run J, read a verdict's meaning, or make a finding about Stacy. A `FAIL` or `anomaly` is left in the file, and it goes to Peter as the brief names. This is a bounded, mechanical, read-only duty, outside your domain, given by ballot.", "cites": "subtraction-3"}], "destination": "#in-scope", "signature": {"signer": "lina", "canonicalHash": "sha256:fa62f16593d61608573d09f2c1fca26bfe91552f0d0639f321c2276b8db4a1dd", "renderedHash": "sha256:25e69652685da607769bb96dc8d392144e1f3bb8cf9f6fbe737987fcfca94e8c", "assent": {"surviving": ["scope-scaffolding", "scope-platforms", "scope-docs", "scope-contract-tests", "scope-token-integration", "scope-schema", "scope-token-mapping", "scope-inheritance", "scope-parity", "scope-theme-consumption", "scope-data-theme", "scope-one-off", "scope-promotion", "scope-maintained-docs"]}, "evidence": "canonical/profiles/consumer/signatures/lina.md#in-scope"}}
