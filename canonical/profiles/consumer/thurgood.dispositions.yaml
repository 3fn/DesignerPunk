  "#mcp-practice-notes": {"disposition": "re-pointed", "removals": [{"text": "**Write-side rebuild protocol** — after modifying content that feeds the docs MCP index (any steering/governance doc), trigger the docs MCP's `rebuild_index` so data is immediately fresh. Agent prompts and configs are not indexed — no MCP impact. Health states: `healthy` | `degraded` | `failed`. Servers auto-detect staleness on a delay; manual monitoring is reduced to exception handling — intervene only on persistent `failed` state or agent-reported anomalies.", "cites": "subtraction-3"}, {"text": "`src/__tests__/` and `src/components/*/__tests__/`", "cites": "subtraction-1"}], "destination": "#mcp-practice-notes"}
