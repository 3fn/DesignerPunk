  "#trigger-types": {"disposition": "re-pointed", "removals": [{"text": "**A RELEASE record is complete only with both phases** (ballot 2026-10-03-hermetic-publish-path § 3.4): a record holding phase 1 alone, still reading `publish-rail liveness: owed`, and a phase 2 drafted against an open step-6 PR that lacks its merge-confirmation line, are each an event without a complete record.", "cites": "subtraction-3"}, {"text": "the health-check, metadata-validation, cross-reference-scan, and affected-docs scripts", "cites": "subtraction-1"}, {"text": "`.kiro/docs/civitas-health-checks/`", "cites": "subtraction-3"}, {"text": "Spec 125-B Req 14; `governance/Product-Handoff-Protocol.md`", "cites": "subtraction-2"}, {"text": "The owed-set pipeline, verbatim (and its ballot ratification date)", "cites": "subtraction-2"}, {"text": "The active-charter walk; the proposed-row register read (`governance/classification-map.md`)", "cites": "subtraction-3"}, {"text": "The grant-activation read (LIVENESS item 4) and its query over `.kiro/issues/` grant records", "cites": "subtraction-3"}], "destination": "#trigger-types", "signature": {"signer": "stacy", "canonicalHash": "sha256:c0eae17781843d50c34fec00c2c31a7772924a04ce3e9c017f1efa2cbc1205fd", "renderedHash": "sha256:da5352d42da3a81edb6708dfbbcf6d045da4e019d331e7a473c98729ce7e5f67", "assent": {"surviving": ["instruments-computed", "event-post-spec", "event-post-prompt", "cadence-health-check", "return-edge", "liveness-records-not-verdicts", "liveness-owed-set", "liveness-records", "discovery-spec", "discovery-feedback", "discovery-audit"]}, "evidence": "canonical/profiles/consumer/signatures/thurgood.md#trigger-types"}}
