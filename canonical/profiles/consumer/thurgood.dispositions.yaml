  "#identity": {"disposition": "re-pointed", "removals": [{"text": "Peter", "cites": "subtraction-2"}, {"text": "for DesignerPunk", "cites": "subtraction-2"}], "destination": "#identity", "signature": {"signer": "stacy", "canonicalHash": "sha256:e396aa201b6a31a256a242b1b52f267804e02bca71865fd8721df8f47afd2255", "renderedHash": "sha256:3a407bdcfe27238327d36a8025209dd2dd2a7c30971796a17a3133cd2a0f576d", "assent": {"surviving": ["thurgood-role", "thurgood-domain", "thurgood-handoff", "thurgood-human-decides", "thurgood-partner"]}, "evidence": "canonical/profiles/consumer/signatures/thurgood.md#identity"}}
  "#in-scope": {"disposition": "re-pointed", "removals": [{"text": "\"Shared\" doc maintenance (MCP-Relationship-Model, MCP-Evolution-Roadmap, Platform-Resource-Map, Process-Integration-Methodology, BUILD-SYSTEM-SETUP, DesignerPunk-Systems-Overview)", "cites": "subtraction-3"}, {"text": "- **CI regime — standing test-lane scope (ballot 2026-09-27-ci-regime-standing-scope § 2)**: in `.github/workflows/lane-timing.yml` only, a step that runs an existing `package.json` test script inside an existing required job, plus its own did-it-really-run floor (fails on zero; same selection as the step). Nothing else — no env/cache/runner/`if:`/`continue-on-error` change, no removed line (`git diff --numstat` deletions 0). **Never**: a new required context, a change to `EXPECTED_CONTEXTS`'s count, branch protection or repo settings (Peter's). In `.github/in-lane-guards.json` only (P1b, ballot 2026-10-20-in-lane-guard-registry-additive-entries): **add** an entry, never change or remove one, never change `version` or another key (that is weakening a floor: an issue-row grant naming the act, or Peter's); the PR shows the additivity predicate `true` against its merge base, the step green with `N registered; N selected` (N the entry count), and per added entry the assertion its record rests on. Every other CI path goes through an issue-row grant (§ 3). ARMING audits each such PR at its merge.", "cites": "subtraction-2"}, {"text": "- **Standing write scope — six roots (ballot 2026-10-17-standing-write-scope-six-roots)**: your write scope lists, by file, the `scripts/` checks you own, the docs MCP (`mcp-server/src/**`, its tests, docs and README), the completion tooling in `.kiro/hooks/`, `.kiro/issues/**`, and the generator's checkers and sweeps. A test, fixture or bite under `scripts/` follows the file it exercises; under `tools/agent-generator/__tests__/` a test follows the module whose basename equals the test filename's stem before its first `.`, in any directory, otherwise its first `../` import, except `entry-tree.test.ts` and `grain-guard.two-sided.test.ts` (shared core) and `semantics-guard.test.ts`, `semantics-guard.fixture.test.ts`, `g1-renderings.provenance.test.ts` and `survivor-sourced.ts` (Lina's), and `__tests__/fixtures/**` follows the test that reads it; the PR that adds or edits a test or fixture names the exercised file in its body. This test rule is enforced on Claude Code only until the per-owner test folders land; until then Kiro `allowedPaths` blocks these tests (`.kiro/issues/2026-10-17-per-owner-test-folders.md`). You are consulted on any change to the generator's shared core (Lina primary) and to the agent layer and docs MCP launch contract in Ada's scope: `src/cli/attach.ts`, `src/cli/sync/RegionGrain.ts`, `src/cli/sync/SteeringDirCheck.ts`, `src/cli/shared/personalNote.ts`, `src/cli/templates/personal-note.{template,example}.md`, `src/cli/shared/mcpConfig/**`, `src/cli/templates/mcp-config.json.template`, and `mcp-server/{package.json,package-lock.json,tsconfig.json,jest.config.js}`; Ada is consulted on any change to `scripts/derive-install-doc.ts`. A legacy completion script still present at the second monthly walk after ratification is a walk finding. `.kiro/hooks/RELEASE-FLOW.md` stays Peter-merged law, and issue files follow `.kiro/issues/README.md` rule 9. Task-row and issue-row grants add to this scope and never narrow it; a grant to you over a path in another seat's standing scope names that seat as consulted, in the grant record and in the PR's `**Consulted**:` line. **Owning an instrument never authorizes changing the law it serves without a ballot** — owning `governance-check.sh` does not let you change what the health check is — **and a seat's write scope moves only by a `canonical/agents/**` edit**, Peter-merged with every affected seat consulted; owning the generator's checkers never authorizes a change to any seat's write scope.", "cites": "subtraction-1"}], "destination": "#in-scope", "signature": {"signer": "stacy", "canonicalHash": "sha256:7beb0570510b6af92be4cf368831f0ea152bbfdf9c1a6867bcd92c1fb792de39", "renderedHash": "sha256:5ac2d4d30cbdce5a9e34a0a66dff621d3e78e87f4500dee9f715f39f2fc72037", "assent": {"surviving": ["scope-1", "scope-2", "scope-3", "scope-4", "scope-5", "scope-6", "scope-7", "scope-8", "scope-9", "scope-10", "civitas-1", "civitas-2", "civitas-3", "civitas-4", "civitas-5", "civitas-6", "civitas-7", "civitas-8", "civitas-9"]}, "evidence": "canonical/profiles/consumer/signatures/thurgood.md#in-scope"}}
