  "#in-scope": {"disposition": "re-pointed", "removals": [{"text": "\"Shared\" doc maintenance (MCP-Relationship-Model, MCP-Evolution-Roadmap, Platform-Resource-Map, Process-Integration-Methodology, BUILD-SYSTEM-SETUP, DesignerPunk-Systems-Overview)", "cites": "subtraction-3"}, {"text": "- **CI regime — standing test-lane scope (ballot 2026-09-27-ci-regime-standing-scope § 2)**: in `.github/workflows/lane-timing.yml` only, a step that runs an existing `package.json` test script inside an existing required job, plus its own did-it-really-run floor (fails on zero; same selection as the step). Nothing else — no env/cache/runner/`if:`/`continue-on-error` change, no removed line (`git diff --numstat` deletions 0). **Never**: a new required context, a change to `EXPECTED_CONTEXTS`'s count, branch protection or repo settings (Peter's). Every other CI path goes through an issue-row grant (§ 3). ARMING audits each such PR at its merge.", "cites": "subtraction-2"}], "destination": "#in-scope", "signature": {"signer": "stacy", "canonicalHash": "sha256:e4224dc56540bf7e0bbc958f5110efdb43990ccca3e4e0262ebd335f0d4822f4", "renderedHash": "sha256:5ac2d4d30cbdce5a9e34a0a66dff621d3e78e87f4500dee9f715f39f2fc72037", "assent": {"surviving": ["scope-1", "scope-2", "scope-3", "scope-4", "scope-5", "scope-6", "scope-7", "scope-8", "scope-9", "scope-10", "civitas-1", "civitas-2", "civitas-3", "civitas-4", "civitas-5", "civitas-6", "civitas-7", "civitas-8", "civitas-9"]}, "evidence": "canonical/profiles/consumer/signatures/thurgood.md#in-scope"}}
