  "#mcp-practice-notes": {"disposition": "re-pointed", "removals": [{"text": "**Write-side rebuild protocol** — after modifying content that feeds the docs MCP index (any steering/governance doc), trigger the docs MCP's `rebuild_index` so data is immediately fresh. Agent prompts and configs are not indexed — no MCP impact. Health states: `healthy` | `degraded` | `failed`. Servers auto-detect staleness on a delay; manual monitoring is reduced to exception handling — intervene only on persistent `failed` state or agent-reported anomalies.", "cites": "subtraction-3"}, {"text": "`src/__tests__/` and `src/components/*/__tests__/`", "cites": "subtraction-1"}], "destination": "#mcp-practice-notes", "signature": {"signer": "stacy", "canonicalHash": "sha256:61b6534dc4861bf69477f5db596cf4018372215da9b47591e9931a5b699be07a", "renderedHash": "sha256:12f983871a77723c1b9933690f75901ce474a1821f24d301d7bcb32f4f3932cd", "assent": {"surviving": ["monitor-exceptions", "mcp-fallback", "kb-fallback"]}, "evidence": "canonical/profiles/consumer/signatures/thurgood.md#mcp-practice-notes"}}
