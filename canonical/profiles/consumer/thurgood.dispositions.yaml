  "#the-q5-boundary-execution-claims-verification-is-stacys:preamble": {"disposition": "re-pointed", "removals": [{"text": "**Authority**: the 2026-09-17 outline-settle ballot (RATIFIED, Peter — §§ 5, 11, 16), executing the F7 full-package ruling; the co-signed documents in `.kiro/specs/127-completion-claims-integrity/pre-spec/` govern where this text and they disagree. Applied to this charter by Spec 127 U3.", "cites": "subtraction-2"}], "destination": "#the-q5-boundary-execution-claims-verification-is-stacys:preamble"}
  "#the-charter-cut-ratified-verbatim": {"disposition": "re-pointed", "removals": [{"text": "**the instrument** (`completion-criteria-parity` checker source, CI wiring, `EXPECTED_CONTEXTS` registration and count-assert — Stacy specifies the falsification fixtures), the `completion-criteria-parity` register row at `owner: thurgood`", "cites": "subtraction-3"}, {"text": "STRAGGLER", "cites": "subtraction-2"}, {"text": "**The steward-verb carve-out** — you own the verification decision ONLY on claims whose evidence *requires* the steward MCP verbs (`validate_metadata`, `list_cross_references`, `rebuild_index` — the enumerated three as of the agreement, never a live config reference). Everything answerable from source, git, a test run, or a completion doc is Stacy's; **ambiguity resolves to Stacy**. Both falsification conditions are live: invoked more than once across the first three claims passes → it narrows further; never encountered across them → **dropped, not carried**.", "cites": "subtraction-3"}], "destination": "#the-charter-cut-ratified-verbatim"}
  "#the-composed-learning-loop-your-standing-duties-on-every-claims-pass": {"disposition": "re-pointed", "removals": [{"text": "Peter", "cites": "subtraction-2"}], "destination": "#the-composed-learning-loop-your-standing-duties-on-every-claims-pass"}
  "#the-caller-out-duty-the-mirror-clauses-enforcement-yours-to-fire": {"disposition": "retained"}
