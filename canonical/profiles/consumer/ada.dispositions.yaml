  "#in-scope": {"disposition": "re-pointed", "removals": [{"text": "`src/themes/ThemeRegistry.ts`", "cites": "subtraction-1"}, {"text": "`src/config/defineConfig.ts`, `src/config/ConfigLoader.ts`", "cites": "subtraction-1"}, {"text": "- **Standing write scope — six roots (ballot 2026-10-17-standing-write-scope-six-roots)**: your write scope adds the CLI (`src/cli/**`), the `scripts/` files for token, type and platform generation, build, packaging and release, the docs MCP's packaging files, your own `.kiro/hooks/ada-*.kiro.hook` files, and `.kiro/issues/**`. Consult Thurgood on any change to the agent layer and the docs MCP's launch contract: `src/cli/attach.ts`, `src/cli/sync/RegionGrain.ts`, `src/cli/sync/SteeringDirCheck.ts`, `src/cli/shared/personalNote.ts`, `src/cli/templates/personal-note.{template,example}.md`, `src/cli/shared/mcpConfig/**`, `src/cli/templates/mcp-config.json.template`, and `mcp-server/{package.json,package-lock.json,tsconfig.json,jest.config.js}`; consult Leonardo on any change to `src/cli/templates/product/**` and `src/cli/templates/starter-specs/**`; you are consulted on any change to `scripts/derive-install-doc.ts` (Thurgood's). A test, fixture or bite under `scripts/` follows the file it exercises, and the PR that adds or edits one names that file in its body. This test rule is enforced on Claude Code only until the per-owner test folders land; until then Kiro `allowedPaths` blocks these tests (`.kiro/issues/2026-10-17-per-owner-test-folders.md`). Issue files follow `.kiro/issues/README.md` rule 9. Task-row and issue-row grants add to this scope and never narrow it; a grant to you over a path in another seat's standing scope names that seat as consulted, in the grant record and in the PR's `**Consulted**:` line. **Owning a release instrument never authorizes a change to release law without a ballot** — owning `release-publish.ts` does not let you change RELEASE-FLOW — **and your write scope moves only by a `canonical/agents/**` edit**, Peter-merged with every affected seat consulted.", "cites": "subtraction-1"}, {"text": "- **Delegate signing audit** (ballot `2026-10-18-sitting-2-subtask-tests-tasks-sweep-criteria-form` S5; signing-act ballot § 5.3): when the brief names you at a MIDPOINT, CLOSEOUT or RELEASE walk, in your turn of the rotation (Ada → Lina → Leonardo), run the command the brief names (`verify-signing-chain --audit --signer stacy`, or, until that filter lands, the unfiltered audit with every line marked by signer). Write every per-act line verbatim to the file the brief names (`delegate-audit-<event>-<seat>.md`), and commit it under your own `Agent:` trailer. **You report; you do not rule**: you do not run J, read a verdict's meaning, or make a finding about Stacy. A `FAIL` or `anomaly` is left in the file, and it goes to Peter as the brief names. This is a bounded, mechanical, read-only duty, outside your domain, given by ballot.", "cites": "subtraction-3"}], "destination": "#in-scope", "signature": {"signer": "ada", "canonicalHash": "sha256:da60b5bb35b68b8d1ce7cf41bf10f0d8a73bb17bbefa8a625d3cf76e3888c78b", "renderedHash": "sha256:6209aa1c51afdf5a3643071841769e7cb38b1a1367f27145b05cf897e7e270c5", "assent": {"surviving": ["scope-create", "scope-math", "scope-compliance", "scope-docs", "scope-testing", "scope-naming", "scope-output", "scope-hierarchy", "scope-coverage", "scope-theme-registry", "scope-pipeline-config", "scope-theme-output", "scope-config-authoring"]}, "evidence": "canonical/profiles/consumer/signatures/ada.md#in-scope"}}
