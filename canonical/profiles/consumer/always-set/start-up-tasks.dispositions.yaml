  "#item-starting-a-parent-task-write-its-instruments-block-first": {"disposition": "re-pointed", "removals": [{"text": "8. **Starting a PARENT task: write its Instruments block first**\n\n   Before a parent's first subtask starts, the PRIMARY writes `.kiro/specs/<spec>/completion/task-<N>-instruments.md` — one row per instrument each success criterion's evidence depends on (test, check, fixture, file, command, upstream artifact), each `exists (<path> @ <sha>)` with a one-line fit clause, `built here (<subtask>)`, or `MISSING → <owner>: <record>`; a criterion needing no instrument gets a `none — <why>` row — and commits it on the unit branch. **Any MISSING stops the subtasks that depend on it, before code**; report it for routing (a consult, then an amendment if the plan changes). A `MISSING` row is never overwritten: its resolution is appended in the row. A gap found later is appended under `## Found later` with its kind (`unlisted` or `misfit`), never silently fixed. Format and the completion-doc header line: Completion Documentation Guide § \"The instruments line and block\". *(Ballot 2026-09-28-parent-instrument-existence-check.)*\n\n   **From the first tasks round after `P`** (the instruments parser PR's squash SHA — ballot § 4a, M4), a spec also declares its instruments in `tasks.md` at planning time; for such a spec this file is written at branch cut as M4's execution file — the pasted command-output existence delta, one fit line per row keyed by row id, rows found at the cut, `## Found later` — never restating a plan row's state or path.", "cites": "subtraction-4"}], "destination": "#item-starting-a-parent-task-write-its-instruments-block-first", "signature": {"signer": "stacy", "canonicalHash": "sha256:450bc8ccda0592e81e09ec9b06ec82b08cf7c6a8512572d7a7674f27df86a2d2", "renderedHash": "sha256:efcc0cd64ec429ae5f89d12787a4689cb76a6f923ff2867550321faf34d2f717", "assent": {"surviving": ["write-block", "missing-stops", "starting-a-parent-ta-3"]}, "evidence": "canonical/profiles/consumer/signatures/start-up-tasks.md#item-starting-a-parent-task-write-its-instruments-block-first"}}
