# adjudications.yaml — recorded owner rulings the sweeps consume (C8; Spec 122 Task 7).
#
# design.md § C8: flagged deltas are NEVER auto-resolved — a sweep fails with an ADJUDICATE:
# block naming the owner until the delta is either FIXED (input/design reconciled) or RULED
# here. A row here does not hide the delta: the sweep report still lists it, marked
# `[adjudicated:<ruling>]`, so a standing ruled delta stays visible on every run.
#
# INTERPRETATION NOTE (Task 7.1, flagged for review): C10.2 records adjudications in the
# per-cutover sweep REPORT (prose, human-readable). A STANDING mechanical check additionally
# needs a machine-readable record to distinguish a ruled delta from an unruled one — an
# `intentional-trim` delta REMAINS a set-difference forever, and without this file the sweep
# would fail every PR after the ruling. This file is that record; the cutover report cites
# the same ruling in prose. "Authority is a record": every row MUST cite a `record` (commit
# sha / report path / feedback-round stamp) where the ruling was made — a row without a
# citable record does not count as a ruling.
#
# Row shape:
#   - sweep: 122-sweep-4-ambient          # the check context the ruling applies to
#     key: data/designed-minus-generated/start-up-tasks   # the finding's adjudicationKey
#     ruling: intentional-trim | assessment-gap | design-change
#     owner: data                         # who ruled (the seat/owner the finding routes to)
#     record: "b7c3c148"                  # citable record of the ruling
#
# Empty today: Data's start-up-tasks adjudication (b7c3c148) was resolved by FIXING the
# designed input (gap #7's union rule — the delta no longer exists post-union), which is the
# preferred resolution; rows land here only for deltas that legitimately PERSIST.
#
# `sweep: audit:coverage-map` rows (Task 8.2, C12): the coverage-map generator's OWN blank-row
# audit reuses this same file + machinery, keyed under a dedicated non-C8 sweep context. A
# blank row here means a generated/canonical surface matches NO check's derived glob (Req 22
# AC4(b)) — same visible-not-silent principle as the C8 ADJUDICATE state.

adjudications:
  - sweep: audit:coverage-map
    key: canonical/generated.lock
    ruling: intentional-trim
    owner: thurgood
    record: ".kiro/specs/122-agent-generator/completion/task-8-2-completion.md § 'Blank-row adjudication' (input/lock artifact — content integrity via the C6 input-closure lock + PR review, not a content check; Stacy's fail-safe analysis recorded there)"

  # --- U7 (Data cutover, Task 13) — token-law adjudication (Ada, token substance owner, 2026-07-11) ---
  # The 119-A spine (per-agent-ambient-design.md § "7. Data") classified `token-quick-reference` as
  # Data's token-first governance-law. Ada ruled that classification does NOT survive materialization:
  # Token-Quick-Reference.md is a routing table whose own Purpose disclaims being a reference — it
  # carries no C7 class-(a) mandate and fails the AXA §3.3 silent-failure discriminator. The mandate
  # Data's token-first EFFECT needs lives in `product-token-governance` (System-First Value Selection),
  # already force-loaded in data.json and the same lock his sibling consumers Sparky/Kenya use. So:
  # token-quick-reference is DEMOTED to an on-demand route; product-token-governance is LOCKED as law.
  # Both are `assessment-gap`: the spine named the right effect but pointed at the wrong doc.
  - sweep: 122-sweep-4-ambient
    key: data/designed-minus-generated/token-quick-reference
    ruling: assessment-gap
    owner: data
    record: ".kiro/specs/122-agent-generator/cutover/data-cutover-report.md § 'Token-law adjudication (Ada, 2026-07-11)' — token-quick-reference is a routing table with no materializable C7 class-(a) mandate; Ada demoted it from Data's governance-as-law to an on-demand doc route (Token Documentation Map). Assessment-gap: the spine named the silent-wrong-tier effect but pointed at the wrong doc."
  - sweep: 122-sweep-4-ambient
    key: data/generated-minus-designed/product-token-governance
    ruling: assessment-gap
    owner: data
    record: ".kiro/specs/122-agent-generator/cutover/data-cutover-report.md § 'Token-law adjudication (Ada, 2026-07-11)' — product-token-governance carries Data's real token-first mandate (System-First Value Selection; force-loaded in data.json; the lock siblings Sparky/Kenya use). Ada ruled it IN as Data's governance-as-law token lock, replacing the mis-classified token-quick-reference. Assessment-gap: the spine omitted the doc carrying the mandate it described."

