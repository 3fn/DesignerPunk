# Read by every ./gradlew call here, so the one invocation of design § 2 needs no flags beyond --continue.
# Plain console: a quiet or rich console has no `> Task` lines, and parse-kotlin.ts attributes diagnostics by them.
org.gradle.console=plain
# No parallel execution: two tasks' `e:` lines could interleave (README § "The parser interface").
org.gradle.parallel=false
# The build scripts read other tasks' state and resolve configurations at execution time.
org.gradle.configuration-cache=false
org.gradle.caching=false
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
android.useAndroidX=true
