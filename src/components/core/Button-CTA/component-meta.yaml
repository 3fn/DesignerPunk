purpose: "Provide a prominent call-to-action button for primary user actions like submitting forms, confirming dialogs, or starting flows."

usage:
  when_to_use:
    - "Text-labeled actions that move a task forward, such as submit, save, continue, or get started"
    - "Paired confirm/cancel actions where the hierarchy is set with primary, secondary, and tertiary variants"
    - "The single most important action on a screen or form footer, where the label must say what happens"
  when_not_to_use:
    - "Displaying read-only status (use Badges instead)"
    - "Creating inline text links (use Link component when available)"
    - "Building toggle controls (use Toggle component when available)"

contexts:
  - "forms"
  - "modals"
  - "onboarding-flows"
  - "dashboards"

alternatives:
  - component: Button-Icon
    reason: "When the action is icon-only without a text label"
  - component: Button-VerticalList-Item
    reason: "When the action appears in a vertical menu-style list"
