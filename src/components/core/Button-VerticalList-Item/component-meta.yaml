purpose: "Represent a single action item within a vertical list menu, supporting tap, select, and multi-select modes."

usage:
  when_to_use:
    - "One row inside a Button-VerticalList-Set, with a label, optional description, and optional leading icon"
    - "Rows whose selected or checked appearance is driven by the parent set rather than managed by the row"
  when_not_to_use:
    - "Displaying read-only status (use Badges instead)"
    - "Creating inline text links (use Link component when available)"
    - "Building toggle controls (use Toggle component when available)"

contexts:
  - "settings-screens"
  - "modals"
  - "list-items"

alternatives:
  - component: Button-CTA
    reason: "When the action is standalone, not part of a vertical list"
  - component: Button-Icon
    reason: "When only an icon-only compact action is needed"
