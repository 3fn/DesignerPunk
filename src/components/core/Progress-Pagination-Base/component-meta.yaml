purpose: "Show simple dot-based pagination indicating the current position within a sequence of pages or steps."

usage:
  when_to_use:
    - "Showing position in a carousel or swipeable content"
    - "Indicating the current page of a short paged sequence with dots, without step labels"
  when_not_to_use:
    - "Navigation is the primary purpose (use navigation components instead)"
    - "Progress is continuous/percentage-based (use a progress bar)"
    - "Steps are non-linear or can be completed in any order"

contexts:
  - "onboarding-flows"
  - "content-feeds"

alternatives:
  - component: Progress-Stepper-Base
    reason: "When steps need labels and the user navigates a defined workflow"
  - component: Progress-Stepper-Detailed
    reason: "When steps need labels, descriptions, and connector lines"
