purpose: "Guide users through a multi-step workflow with labeled nodes, step descriptions, and connector lines showing full progress detail."

usage:
  when_to_use:
    - "Showing labeled steps with descriptions in complex workflows"
    - "Multi-step flows where each step needs a visible label, optional helper text, and an optional icon"
  when_not_to_use:
    - "Navigation is the primary purpose (use navigation components instead)"
    - "Progress is continuous/percentage-based (use a progress bar)"
    - "Steps are non-linear or can be completed in any order"

contexts:
  - "onboarding-flows"
  - "forms"

alternatives:
  - component: Progress-Stepper-Base
    reason: "When step labels are sufficient without descriptions or connector lines"
  - component: Progress-Pagination-Base
    reason: "When simple dot indicators are sufficient"
