purpose: "Draw a visual connector line between progress indicator nodes to show step sequence and completion flow."

usage:
  when_to_use:
    - "Internal: rendered by Progress-Stepper-Base and Progress-Stepper-Detailed as the line between step nodes"
    - "Building a new Progress semantic component that needs an active or inactive line joining its nodes"
  when_not_to_use:
    - "Direct use in product screens — use Progress-Stepper-Base, Progress-Stepper-Detailed, or Progress-Pagination-Base"

contexts:
  - "onboarding-flows"
  - "forms"

alternatives: []
