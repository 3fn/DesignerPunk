purpose: "Render a single step indicator node showing completion state (incomplete, active, complete) within a progress sequence."

usage:
  when_to_use:
    - "Internal: rendered by Progress-Pagination-Base and the Progress-Stepper components as each step's indicator dot or icon"
    - "Building a new Progress semantic component that needs a stateful step node (incomplete, current, completed, error)"
  when_not_to_use:
    - "Direct use in product screens — use Progress-Stepper-Base, Progress-Stepper-Detailed, or Progress-Pagination-Base"

contexts:
  - "onboarding-flows"
  - "forms"

alternatives: []
