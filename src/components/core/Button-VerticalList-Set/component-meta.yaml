purpose: "Group Button-VerticalList-Item components into a vertical action menu with mode-driven selection behavior (tap, select, multi-select)."

usage:
  when_to_use:
    - "Vertical menus of tappable actions (tap mode), such as an account or settings menu"
    - "Single-choice lists of rich rows with labels and descriptions (select mode)"
    - "Multiple-choice lists of rich rows with minimum and maximum selection limits (multiSelect mode)"
  when_not_to_use:
    - "Displaying read-only status (use Badges instead)"
    - "Creating inline text links (use Link component when available)"
    - "Building toggle controls (use Toggle component when available)"

contexts:
  - "settings-screens"
  - "modals"
  - "list-items"

alternatives:
  - component: Input-Radio-Set
    reason: "When the selection is form data (radio-style) rather than action-driven"
