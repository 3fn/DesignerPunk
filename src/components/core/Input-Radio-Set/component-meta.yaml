purpose: "Group radio buttons into a mutually exclusive selection set where only one option can be active at a time."

usage:
  when_to_use:
    - "Single selection from a group (always give the group a name with the required accessibilityLabel, e.g. \"Theme\")"
    - "Subscription plan selection"
    - "Survey question (pick one)"
  when_not_to_use:
    - "Email address collection — use Input-Text-Email"
    - "Password entry — use Input-Text-Password"
    - "Phone number collection — use Input-Text-PhoneNumber"
    - "Generic text input — use Input-Text-Base"
    - "Custom validation needs — use Input-Text-Base"
    - "Terms of service acceptance — use Input-Checkbox-Legal"
    - "Privacy policy consent — use Input-Checkbox-Legal"
    - "Marketing opt-in — use Input-Checkbox-Legal"
    - "Generic binary selection — use Input-Checkbox-Base"
    - "Parent checkbox (select all) — use Input-Checkbox-Base"
    - "Settings toggle — use Input-Checkbox-Base"
    - "Standalone radio (rare) — use Input-Radio-Base"
    - "Displaying read-only text (use Data Displays instead)"
    - "Need multi-line text input (use Textarea component when available)"
    - "Building search interfaces (use Search component when available)"

contexts:
  - "forms"
  - "settings-screens"
  - "onboarding-flows"

alternatives:
  - component: Input-Checkbox-Base
    reason: "When several options may be chosen at once"
  - component: Button-VerticalList-Set
    reason: "When the single choice is shown as rich list rows that drive an action rather than form data"
