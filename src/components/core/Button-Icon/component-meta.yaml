purpose: "Provide a compact icon-only button for toolbar actions, close buttons, or secondary actions where space is limited."

usage:
  when_to_use:
    - "Icon-only actions where space is limited and the icon is widely recognized (close, edit, share, more)"
    - "Repeated per-item actions in list rows or cards, where a text label on every item would add clutter"
    - "Compact secondary actions placed beside content rather than as a standalone call to action"
  when_not_to_use:
    - "Displaying read-only status (use Badges instead)"
    - "Creating inline text links (use Link component when available)"
    - "Building toggle controls (use Toggle component when available)"

contexts:
  - "app-bars"
  - "modals"
  - "list-items"

alternatives:
  - component: Button-CTA
    reason: "When the action needs a visible text label for clarity"
  - component: Button-VerticalList-Item
    reason: "When the action appears in a vertical menu-style list"
