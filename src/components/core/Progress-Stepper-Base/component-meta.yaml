purpose: "Guide users through a multi-step workflow with labeled nodes showing step names and completion state."

usage:
  when_to_use:
    - "Displaying progress through a linear multi-step flow of up to eight steps"
    - "Showing which steps are completed, current, or in error when the steps do not need visible labels"
  when_not_to_use:
    - "Navigation is the primary purpose (use navigation components instead)"
    - "Progress is continuous/percentage-based (use a progress bar)"
    - "Steps are non-linear or can be completed in any order"

contexts:
  - "onboarding-flows"
  - "forms"

alternatives:
  - component: Progress-Pagination-Base
    reason: "When simple dot indicators are sufficient without step labels"
  - component: Progress-Stepper-Detailed
    reason: "When steps need descriptions, connector lines, and richer visual detail"
