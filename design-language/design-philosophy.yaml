# DesignerPunk Design Philosophy
# Source data for Application MCP's design language tools.
# Indexed by DesignPhilosophyIndexer via DataPaths config.

schemaVersion: 1

philosophy:
  northStar: "Electric Precision"
  description: |
    DesignerPunk's visual identity lives at the intersection of mathematical rigor and electric energy. The layout is calm; the color is not. Structure and hierarchy follow Wise-level clarity: generous whitespace, obvious information architecture, content-first composition. Color and accent follow Edgerunners-level commitment: vivid, saturated, unapologetic. These don't compete because they operate on different dimensions. Clarity for structure. Intensity for voice. Every value is traceable to a formula. Every color earns its place through contrast and intent.
  characteristics:
    - "Electric color commitment regardless of mode. Light surfaces are clean and bright with vivid accents that pop. Dark surfaces are deep with accents that glow."
    - "Saturated accents with distinct semantic roles: cyan for action/navigation/selection, purple for tech/data, pink for error, yellow for attention, green for success, orange for warning and human identity, teal for information and agent identity"
    - "Glow effects as a signature element for surface layering and depth (neon aesthetic, purposeful not decorative)"
    - "Code as visual language. The <!-- logo references HTML's foundational syntax. Sparingly used code markers (//) are part of the brand experience. The machinery is visible."
    - "8px baseline grid for layout, 4px sub-grid for typography. All elements cumulatively align to multiples of 8."
    - "Three font families: Rajdhani (display/headings), Figtree (body/UI), Commit Mono (code/data/tokens)"
    - "Semantic spacing categories encode design intent (grouped/related/separated/sectioned/inset)"
    - "Concept-first color naming organized by role (feedback, identity, action, contrast, structure, progress), not by hue"
    - "Blend utilities for state modifications (hover, pressed, disabled) rather than hardcoded state colors"
    - "Unitless token architecture with build-time platform separation (CSS, Swift, Kotlin from single source)"
    - "Dual themes: Original (maximum aesthetic impact) + WCAG 2.1 AA (accessible while maintaining character), each with light/dark modes"

rules:
  - name: "The Formula Rule"
    constraint: "Every value must be derivable from a mathematical relationship"
    rationale: "Traceability creates trust. Arbitrary values erode system integrity."
  - name: "The Semantic-First Rule"
    constraint: "Use semantic tokens before primitives. Only reach for primitives when no semantic token exists for the use case."
    rationale: "Semantics encode intent; primitives encode value. Intent is more stable than value."
  - name: "The Contract Rule"
    constraint: "Every component behavior is explicit, documented, and testable across platforms"
    rationale: "Implicit behavior creates platform drift. Explicit contracts prevent it."
  - name: "The Clarity Rule"
    constraint: "Layout and hierarchy must be immediately obvious. If you have to study it to understand it, simplify."
    rationale: "Electric color earns its impact from calm structure. Chaos plus intensity is noise."
  - name: "The Earn-Your-Glow Rule"
    constraint: "Glow effects are used for layering surfaces and creating depth. Pair complementary colors for glow relationships."
    rationale: "Neon glow communicates elevation and spatial relationships, not decoration. Complementary pairings create visual harmony within intensity."
  - name: "The One-Accent Rule"
    constraint: "No more than one accent hue per component or interaction moment. Pair complementary colors across adjacent surfaces, not within a single element."
    rationale: "Each color has a semantic role. Mixing roles in one element creates confusion. Complementary pairing across surfaces creates cohesion."
  - name: "The Visible Machinery Rule"
    constraint: "Code syntax markers (//, <!--) are used sparingly as brand voice, not as decoration or on every surface"
    rationale: "The system acknowledges its nature. But overuse turns a signature into a gimmick."
  - name: "The Mode-Neutral Rule"
    constraint: "Design for both light and dark modes. Neither is an afterthought. Both must feel intentionally DesignerPunk."
    rationale: "The electric palette works in both modes. Light isn't safe mode. Dark isn't cool mode. Both are the brand."
  - name: "The Break-Glass Rule"
    constraint: "Rules can be broken for moments of critical impact, but only sparingly and with explicit authorization."
    rationale: "A system that never breaks its own rules is rigid. A system that breaks them without discipline is chaos. The exception proves the rule when it's earned."

guidance:
  do:
    - category: "spacing"
      directive: "Use the 8px baseline grid for layout elements. Typography falls on a 4px sub-grid. All elements must cumulatively align to multiples of 8."
    - category: "spacing"
      directive: "Use semantic spacing tokens (space.grouped, space.separated, space.inset) to encode relationships"
    - category: "spacing"
      directive: "Vary spacing for rhythm; uniform padding is monotony"
    - category: "spacing"
      directive: "Use space075 (6) and space125 (10) when needed to maintain cumulative 8px alignment with typographic elements"
    - category: "color"
      directive: "Use saturated accents with their semantic roles: cyan for action/navigation, purple for tech/data, pink for error, yellow for attention, green for success, orange for warning, teal for info"
    - category: "color"
      directive: "Pair complementary colors across adjacent surfaces for cohesion"
    - category: "color"
      directive: "Design for both light and dark modes with equal intentionality"
    - category: "typography"
      directive: "Use Rajdhani for display/headings, Figtree for body/UI, Commit Mono for code/data/tokens"
    - category: "typography"
      directive: "Cap body text at 65-75ch"
    - category: "typography"
      directive: "Use weight contrast for hierarchy within a family (not font switching)"
    - category: "motion"
      directive: "Use expo-out easing on web/Android; spring physics on iOS"
    - category: "motion"
      directive: "Respect prefers-reduced-motion on all animations"
    - category: "elevation"
      directive: "Use glow effects for surface layering and depth with complementary color pairings"
    - category: "elevation"
      directive: "Tint shadows toward blue or gray (warm-light-cool-shadow principle)"
    - category: "brand"
      directive: "Use code syntax markers (//, <!--) sparingly as voice"
    - category: "brand"
      directive: "Let the system acknowledge its own nature; don't hide the machinery"
    - category: "general"
      directive: "Reference token names in specs, not pixel values"
  dont:
    - category: "spacing"
      directive: "Use spacing values that break cumulative 8px alignment"
    - category: "color"
      directive: "Use more than one accent hue per component"
    - category: "color"
      directive: "Use glow effects decoratively (they communicate depth, not decoration)"
    - category: "color"
      directive: "Default to muted/safe palettes. The electric palette is the brand regardless of mode."
    - category: "typography"
      directive: "Use decorative or display typefaces outside of Rajdhani"
    - category: "typography"
      directive: "Use monospace for non-technical content"
    - category: "motion"
      directive: "Use bounce or elastic easing on web/Android"
    - category: "motion"
      directive: "Add motion that doesn't communicate state or spatial relationship"
    - category: "elevation"
      directive: "Use pure black shadows (always tint toward blue or gray)"
    - category: "brand"
      directive: "Overuse code syntax markers (sparingly = signature; everywhere = gimmick)"
    - category: "general"
      directive: "Hedge in copy ('you might want to consider' becomes 'use')"
    - category: "general"
      directive: "Use glassmorphism, gradient text, or side-stripe borders"
    - category: "general"
      directive: "Use identical card grids without hierarchy variation"
    - category: "general"
      directive: "Break rules without explicit authorization (see The Break-Glass Rule)"

colorStrategy:
  - tier: "Restrained"
    definition: "Neutral surfaces dominate. One accent color at 10% or less of the surface. Semantic roles only (action buttons, links, state indicators)."
    whenToUse: "Product register defaults. Settings pages, data tables, admin panels, dense information screens, long-form reading."
    whenNotToUse: "Brand-heavy surfaces, hero sections, onboarding, celebration moments."
    example: "A settings screen with white/gray surfaces and cyan only on the save button and active nav item."
  - tier: "Committed"
    definition: "One saturated color carries 30-60% of the surface. The color IS the statement."
    whenToUse: "Hero sections, feature highlights, onboarding flows, marketing pages, brand-register surfaces."
    whenNotToUse: "Dense data interfaces, multi-action screens, long-form reading."
    example: "A hero section with a deep cyan background, white text, and a complementary purple glow on the primary CTA."
  - tier: "Full Palette"
    definition: "3-4 semantic color roles used deliberately across the surface. Each color earns its place through its assigned role."
    whenToUse: "Dashboards, status overviews, multi-category interfaces, data visualization, progress flows."
    whenNotToUse: "Simple forms, single-purpose screens, text-heavy content."
    example: "A dashboard with cyan for active actions, green for success states, orange for warnings, and purple for data visualizations."
  - tier: "Drenched"
    definition: "The surface IS the color. Color is the dominant visual element. Content is secondary to atmosphere."
    whenToUse: "Splash screens, loading states, celebration moments, brand campaigns, critical impact moments (Break-Glass Rule applies)."
    whenNotToUse: "Any screen where the user needs to read, interact, or complete a task."
    example: "An app launch screen entirely in electric cyan with the <!--DesignerPunk logo in white. Or a success celebration that floods the screen in green."
